<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyLight RCM — Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>

<style>
:root{
  --navy:#0D1B32;
  --teal:#0B444E;
  --rail-hi:#18314A;
  --rail-on:#1B4A55;
  --mint:#00CC9C;
  --mint-ink:#007A5C;
  --mint-soft:#E1F8F1;
  --page:#F6F8F7;
  --panel:#FFFFFF;
  --text:#10222C;
  --mute:#6D8189;
  --faint:#93A5AB;
  --rule:#E8ECEA;
  --soft:#F1F4F3;
  --rose:#A9483B;
  --rose-soft:#FAECE9;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --disp:'Archivo',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--page)}
body{font-family:var(--body);background:var(--page);color:var(--text);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:242px;flex:0 0 242px;color:#CBDBDD;
  background:linear-gradient(163deg,var(--navy) 0%,#0C2A3D 52%,var(--teal) 100%);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:26px 20px 22px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:46px;height:46px;display:block;margin:0 auto 12px}
.brand b{display:block;font-family:var(--disp);font-weight:700;font-size:17px;color:#fff;letter-spacing:-.015em;line-height:1.2}
.brand span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);margin-top:7px;opacity:.85}
.navgroup{padding:18px 12px 8px}
.navlabel{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);opacity:.9;padding:0 9px 9px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:7px;color:#B6CBCE;font-size:13.5px;font-weight:450;transition:background .14s,color .14s}
.navitem:hover{background:var(--rail-hi);color:#fff}
.navitem.on{background:var(--rail-on);color:#fff;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);flex:0 0 auto}
.navitem.on .dot,.navitem:hover .dot{background:var(--mint)}
.railfoot{margin-top:auto;padding:16px 12px 20px;border-top:1px solid rgba(255,255,255,.08)}






.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.topbar>.tinner{max-width:880px;margin:0 auto;width:100%;padding:20px 40px}
.crumb{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--mint-ink)}
.crumb b{color:var(--mint-ink);font-weight:600}
.topbar h1{font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:3px;line-height:1.3}
.wrap{padding:36px 40px 90px;max-width:880px;margin:0 auto;width:100%}

/* ---------- dashboard ---------- */
.hello{margin-bottom:30px}
.hello h2{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.hello p{color:var(--mute);font-size:15px;margin-top:7px}
.continue{
  display:flex;align-items:center;gap:18px;width:100%;
  background:linear-gradient(150deg,var(--navy),var(--teal));
  border-radius:13px;padding:24px 26px;color:#fff;margin-bottom:38px;
  transition:transform .16s;
}
.continue:hover{transform:translateY(-2px)}
.continue .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--mint);margin-bottom:7px}
.continue h3{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.continue .sub{font-size:13.5px;color:#9DB6B9;margin-top:4px}
.continue .arrow{margin-left:auto;flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.continue.done{background:var(--panel);color:var(--text);border:1px solid var(--rule)}
.continue.done .sub{color:var(--mute)}

.grouphead{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--mint-ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grouphead::before{content:'';width:14px;height:2px;border-radius:2px;background:var(--mint);flex:0 0 auto}

.tcard{display:block;width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:13px;padding:22px 24px;margin-bottom:12px;transition:border-color .16s,transform .16s}
.tcard:hover{border-color:#CBD6D2;transform:translateY(-1px)}
.tcard .top{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.tcard h3{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:-.015em}
.tcard .pct{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--mint-ink)}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s}
.tcard .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint)}

.soonbox{background:var(--panel);border:1px solid var(--rule);border-radius:13px;overflow:hidden}
.soonrow{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--rule)}
.soonrow:last-child{border-bottom:none}
.soonrow .nm{font-weight:500;font-size:14.5px;color:var(--mute)}
.soonrow .st{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}

/* ---------- shared ---------- */
.sect{margin-bottom:36px}
.secthead{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.secthead{align-items:center;padding-bottom:11px;border-bottom:1px solid var(--rule)}
.secthead h2{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--mint-ink);display:flex;align-items:center;gap:8px}
.secthead h2::before{content:'';width:14px;height:2px;border-radius:2px;background:var(--mint);flex:0 0 auto}
.secthead .note{font-family:var(--mono);font-size:11px;color:var(--mute);margin-left:auto;font-weight:500}
.lede{color:var(--mute);font-size:14.5px;max-width:62ch;margin-bottom:26px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:13px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.done{background:var(--mint-soft);color:var(--mint-ink)}
.chip.prog{background:var(--soft);color:var(--mute)}
.chip.fail{background:var(--rose-soft);color:var(--rose)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;font-weight:600;transition:background .14s}
.btn:hover{background:var(--teal)}
.btn.mint{background:var(--mint);color:var(--navy)}
.btn.mint:hover{background:#00B88C}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--rule)}
.btn.ghost:hover{background:var(--soft);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.backlink{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-ink);margin-bottom:20px}
.backlink:hover{color:var(--mint-ink)}

/* ---------- module rows ---------- */
.row{display:flex;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid var(--rule);width:100%;transition:background .12s}
.row:last-child{border-bottom:none}
.row:hover{background:#FAFBFA}
.rowno{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);flex:0 0 26px}
.rowbody{flex:1;min-width:0}
.rowtitle{display:block;font-weight:500;font-size:14.5px;letter-spacing:-.005em}
.rowmeta{display:block;font-size:12.5px;color:var(--faint);margin-top:3px}
.rowright{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.gate{padding:14px 24px;background:#FAFBFA;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px}
.gate:last-child{border-bottom:none}
.gate .pin{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:0 0 auto}

/* ---------- content slots ---------- */
.slot{border:1.5px dashed #D3DCD8;border-radius:13px;padding:34px 24px;text-align:center;background:#FBFCFB;margin-bottom:20px}
.slot .id{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--navy);color:#fff;padding:4px 11px;border-radius:99px;letter-spacing:.07em}
.slot p{color:var(--mute);font-size:14px;margin-top:13px}
.slot .hint{font-size:12.5px;margin-top:6px;color:var(--faint)}
.videoslot{border:1.5px dashed #D3DCD8;border-radius:13px;background:#FBFCFB;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;margin-bottom:20px}
.prose{background:var(--panel);border:1px solid var(--rule);border-radius:13px;padding:30px 32px;margin-bottom:20px}
.prose h3{font-family:var(--disp);font-size:16px;font-weight:600;margin:26px 0 9px;letter-spacing:-.015em}
.prose h3:first-child{margin-top:0}
.prose p{margin-bottom:13px;font-size:15px}
.prose ul{margin:0 0 13px 21px}
.prose li{margin-bottom:6px;font-size:15px}
.prose .eg{background:var(--mint-soft);border-left:3px solid var(--mint);padding:12px 16px;margin-bottom:14px;font-size:14.5px;border-radius:0 7px 7px 0}
.sample{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mint-ink);background:var(--mint-soft);padding:5px 11px;border-radius:99px;margin-bottom:18px}

/* ---------- quiz ---------- */
.q{border-bottom:1px solid var(--rule);padding:24px 28px}
.q:last-of-type{border-bottom:none}
.qn{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--mint-ink);margin-bottom:9px;letter-spacing:.1em;text-transform:uppercase}
.qt{font-weight:600;font-size:15px;margin-bottom:14px;line-height:1.55}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;border:1px solid var(--rule);border-radius:9px;margin-bottom:8px;width:100%;font-size:14.5px;transition:all .13s}
.opt:hover:not(:disabled){border-color:#C6D2CE;background:#FAFBFA}
.opt.pick{border-color:var(--navy);background:var(--soft)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:#DDB6AE;background:var(--rose-soft)}
.opt .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--faint);flex:0 0 auto;padding-top:2px}
.quizfoot{padding:20px 28px;background:#FAFBFA;border-top:1px solid var(--rule);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.scorebox{display:flex;align-items:baseline;gap:9px}
.scorebox b{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1;color:var(--mint-ink)}
.scorebox.low b{color:var(--rose)}
.scorebox span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint)}

/* ---------- rubric ---------- */
.rubricwrap{overflow-x:auto}
.rubric{width:100%;border-collapse:collapse;min-width:620px}
.rubric th{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-ink);text-align:left;padding:13px 14px;border-bottom:1px solid var(--rule);background:#FAFBFA}
.rubric td{padding:0;border-bottom:1px solid var(--rule);vertical-align:top}
.rubric .crit{padding:16px 18px;font-weight:600;font-size:14px;width:30%;border-right:1px solid var(--rule)}
.rubric .crit small{display:block;font-weight:400;font-size:12px;color:var(--faint);margin-top:4px;line-height:1.5}
.lvl{width:100%;min-height:78px;padding:13px 14px;border-right:1px solid var(--rule);font-size:12.5px;line-height:1.5;color:var(--faint);transition:background .13s}
.lvl:last-child{border-right:none}
.lvl:hover:not(:disabled){background:#FAFBFA}
.lvl b{display:block;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text);margin-bottom:5px}
.lvl.on{background:var(--mint-soft);color:var(--text)}
.lvl.on b{color:var(--mint-ink)}
.lvl:disabled{cursor:default}
.rubricfoot{padding:20px 28px;background:#FAFBFA;border-top:1px solid var(--rule);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.await{padding:44px 24px;text-align:center;color:var(--mute);font-size:14.5px}

/* ---------- checklist ---------- */
.clrow{display:flex;align-items:center;gap:16px;padding:13px 24px;border-bottom:1px solid var(--rule)}
.clrow:last-child{border-bottom:none}
.clid{font-family:var(--mono);font-size:12px;font-weight:600;flex:0 0 138px;color:var(--mint-ink)}
.cldesc{flex:1;font-size:13.5px;min-width:0;color:var(--mute)}
.summary{display:flex;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:13px;padding:18px 22px;flex:1;min-width:120px}
.stat b{font-family:var(--mono);font-size:25px;font-weight:600;display:block;line-height:1.1}
.stat span{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--mint-ink)}

.saving{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.saving.show{opacity:1}


.chip.lock{background:#EFF1EF;color:var(--faint)}
.row.locked{opacity:.55;cursor:default;background:#FBFCFB}
.row.locked:hover{background:#FBFCFB}
.gatebar{background:var(--mint-soft);border:1px solid #BFEBDD;border-radius:11px;padding:15px 18px;
  font-size:13.5px;color:#0B4A3A;margin-bottom:26px;line-height:1.6}
.gatebar.soft{margin-bottom:14px}
.gatebar b{font-weight:600}
.unlocked{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--mint-ink)}
table.roots{border-collapse:collapse;margin:0 0 14px;width:100%}
table.roots td{padding:7px 12px;border-bottom:1px solid var(--rule);font-size:14.5px;vertical-align:top}
table.roots tr:last-child td{border-bottom:none}
table.roots td.rt{font-family:var(--mono);font-weight:600;color:var(--mint-ink);width:38%;white-space:nowrap}
.prose ul{columns:2;column-gap:28px}
.prose ul li{break-inside:avoid}
@media (max-width:600px){.prose ul{columns:1}table.roots td.rt{width:46%}}


table.bench{width:100%;border-collapse:collapse}
table.bench th{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mint-ink);text-align:left;padding:12px 16px;
  border-bottom:1px solid var(--rule);background:#FAFBFA}
table.bench td{padding:13px 16px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:middle}
table.bench tr:last-child td{border-bottom:none}
td.bl{font-weight:500}
td.bt{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap}
td.bw{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
td.bs{text-align:right;white-space:nowrap}
input.bin{width:88px;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;
  font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);background:#fff}
input.bin:disabled{background:var(--soft);color:var(--mute)}
input.bin:focus{outline:2px solid var(--mint);outline-offset:1px;border-color:var(--mint)}
button.tick{border:1px solid var(--rule);border-radius:7px;padding:8px 14px;font-size:13px;
  font-weight:500;color:var(--mute);background:#fff;transition:all .14s}
button.tick:hover:not(:disabled){border-color:var(--mint);color:var(--mint-ink)}
button.tick.on{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-ink);font-weight:600}
button.tick:disabled{background:var(--soft);cursor:default}
.belowmsg{font-size:12.5px;color:var(--rose);line-height:1.5}
.drill{margin:0 0 16px}
.dlabel{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mint-ink);margin-bottom:7px}
.drill pre{background:var(--navy);color:#BFEFE0;border-radius:9px;padding:15px 17px;
  font-family:var(--mono);font-size:12.5px;line-height:1.9;overflow-x:auto;white-space:pre}
table.keys{border-collapse:collapse;margin:0 0 16px;width:100%}
table.keys td{padding:8px 12px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:top}
table.keys tr:last-child td{border-bottom:none}
table.keys td.kk{font-family:var(--mono);font-weight:600;color:var(--mint-ink);
  width:40%;white-space:nowrap;font-size:13px}
@media (max-width:600px){
  table.bench td,table.bench th{padding:10px 12px;font-size:13px}
  td.bt{white-space:normal}
  input.bin{width:70px}
  table.keys td.kk{width:46%;font-size:12px}
  .drill pre{font-size:11px}
}


ol.steps{counter-reset:st;list-style:none;margin:0 0 16px;padding:0}
ol.steps li{counter-increment:st;position:relative;padding:0 0 14px 40px;border-left:1px solid var(--rule);margin-left:11px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:counter(st);position:absolute;left:-11px;top:0;width:22px;height:22px;
  border-radius:50%;background:var(--mint-soft);color:var(--mint-ink);font-family:var(--mono);
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.steps li b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px;line-height:1.4}
ol.steps li span{display:block;font-size:14px;color:var(--mute);line-height:1.55}
ul.chk,ul.warn{list-style:none;margin:0 0 16px;padding:0;columns:1}
ul.chk li,ul.warn li{position:relative;padding:0 0 8px 26px;font-size:14.5px;line-height:1.55;break-inside:avoid}
ul.chk li::before{content:'✓';position:absolute;left:0;top:0;color:var(--mint-ink);font-weight:700;font-size:13px}
ul.warn li::before{content:'✕';position:absolute;left:0;top:0;color:var(--rose);font-weight:700;font-size:13px}
.rule{background:var(--navy);border-radius:11px;padding:18px 22px;margin:0 0 18px;
  background:linear-gradient(150deg,var(--navy),var(--teal))}
.rule span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--mint);margin-bottom:7px}
.rule b{display:block;font-family:var(--disp);font-size:17px;font-weight:600;color:#fff;
  letter-spacing:-.015em;line-height:1.4}
@media (max-width:600px){.rule b{font-size:15.5px}ol.steps li{padding-left:34px}}


/* ================= INTERACTION LAYER ================= */
:root{--ez:cubic-bezier(.4,0,.2,1);
  --sh1:0 1px 2px rgba(13,27,50,.05);
  --sh2:0 10px 28px -8px rgba(13,27,50,.18);
  --shm:0 10px 30px -10px rgba(0,204,156,.45)}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.anim{animation:fadeUp .32s var(--ez)}

/* --- sidebar --- */
.navitem{position:relative;white-space:normal;line-height:1.35;align-items:center}
.navitem::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:0;background:var(--mint);border-radius:0 3px 3px 0;transition:height .22s var(--ez)}
.navitem:hover::before{height:56%}

      <div class="sample">Sample content — replace with your own</div>
      <h3>Why grammar matters in this work</h3>
      <p>You will write notes that a US doctor reads and signs. A small grammar error can change the meaning of a clinical note. "The patient denies chest pain" and "The patient denied chest pain" are read differently by a reviewer.</p>
      <h3>1. Tenses</h3>
      <p>Use <b>simple past</b> for what happened during the visit. Use <b>present</b> for what is true now.</p>
      <div class="eg">The patient <b>reported</b> pain for three days. She <b>takes</b> metformin daily.</div>
      <h3>2. Articles — a, an, the</h3>
      <p>Use <b>a / an</b> the first time you mention something. Use <b>the</b> after that.</p>
      <div class="eg">We ordered <b>an</b> X-ray. <b>The</b> X-ray showed no fracture.</div>
      <h3>3. Prepositions</h3>
      <p>Learn these as fixed pairs, not by rule.</p>
      <ul><li>admitted <b>to</b> hospital</li><li>complains <b>of</b> pain</li>
      <li>allergic <b>to</b> penicillin</li><li>discharged <b>on</b> medication</li></ul>
      <h3>4. Subject–verb agreement</h3>

/* ---------- audit question generator ---------- */
const low = s => String(s).toLowerCase().trim();

function uniqueItems(sys, key, all){
  return sys[key].filter(x => !all.some(o => o.id !== sys.id && o[key].map(low).includes(low(x))));
}
function foreignItems(sys, key, all){
  const mine = new Set(sys[key].map(low));
  const seen = new Set(); const out = [];
  all.filter(o => o.id !== sys.id).forEach(o => o[key].forEach(x => {
    if(!mine.has(low(x)) && !seen.has(low(x))){ seen.add(low(x)); out.push(x); }
  }));
  return out;
}
// deterministic pick of n items, spread across the source list
function spread(list, n, offset){
  const out = []; if(!list.length) return out;
  const step = Math.max(1, Math.floor(list.length / n));
  for(let i = 0; out.length < n && i < list.length * 2; i++){
    const v = list[(offset + i * step) % list.length];
    if(!out.includes(v)) out.push(v);
  }
  return out;
}
// build one MCQ with the correct answer placed deterministically
function mk(q, correct, wrongs, seed){
  const opts = wrongs.slice(0,3);
  const pos = seed % 4;
  opts.splice(pos, 0, correct);
  return {q, opts, a:pos};
}

function buildPool(sys, all){
  const pool = [];
  let seed = 0;
  const S = sys.name.replace(/ system$/,'').replace(/^Sensory systems: /,'');

  // root -> meaning
  const allMeanings = [...new Set(all.flatMap(o => o.roots.map(r => r[1])))];
  sys.roots.forEach(([r,m]) => {
    const wrongs = spread(allMeanings.filter(x => low(x) !== low(m)), 3, seed);
    pool.push(mk(`What does the word root "${r}" mean?`, m, wrongs, seed++));
  });
  // meaning -> root (only roots unique across all systems)
  const allRoots = all.flatMap(o => o.roots.map(r => r[0]));
  sys.roots.filter(([r]) => allRoots.filter(x => low(x) === low(r)).length === 1)
    .slice(0,4).forEach(([r,m]) => {
      const wrongs = spread([...new Set(allRoots)].filter(x => low(x) !== low(r)), 3, seed);
      pool.push(mk(`Which word root means "${m}"?`, r, wrongs, seed++));
    });

  const cat = (key, label) => {
    const mine = uniqueItems(sys, key, all);
    const foreign = foreignItems(sys, key, all);
    spread(mine, 4, 1).forEach(item => {
      pool.push(mk(`Which of these is ${label} of the ${S} system?`, item, spread(foreign, 3, seed), seed++));
    });
  };
  cat('structures','a major structure');
  cat('conditions','a common condition');
  cat('tests','a common test');
  cat('procedures','a common procedure');
  cat('symptoms','a common symptom');

  // documentation specificity
  const foreignSpec = foreignItems(sys, 'spec', all);
  spread(uniqueItems(sys,'spec',all), 3, 0).forEach(item => {
    pool.push(mk(`For ${S} services, which detail must the documentation specify?`, item, spread(foreignSpec, 3, seed), seed++));
  });

  // main function
  const otherFns = all.filter(o => o.id !== sys.id).map(o => o.fn);
  pool.push(mk(`What is the main function of the ${S} system?`, sys.fn, spread(otherFns, 3, seed), seed++));

  // applied / RCM judgement
  (sys.applied || []).forEach(q => pool.push(q));
  return pool;
}

const LOM_POOLS = {};
BODY_SYSTEMS.forEach(s => LOM_POOLS[s.id] = buildPool(s, BODY_SYSTEMS));

function systemBody(s){
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join('');
  return `
  <h3>Major structures</h3><ul>${li(s.structures)}</ul>
  <h3>Main function</h3><p>${esc(s.fn)}</p>
  <h3>Important word roots</h3>
  <table class="roots"><tbody>${s.roots.map(([r,m]) =>
    `<tr><td class="rt">${esc(r)}</td><td>${esc(m)}</td></tr>`).join('')}</tbody></table>
  <h3>Common symptoms</h3><ul>${li(s.symptoms)}</ul>
  <h3>Common conditions</h3><ul>${li(s.conditions)}</ul>
  <h3>Common tests</h3><ul>${li(s.tests)}</ul>
  <h3>Common procedures</h3><ul>${li(s.procedures)}</ul>
  <h3>Documentation specificity</h3><ul>${li(s.spec)}</ul>
  <h3>Why this matters in RCM</h3>
  <div class="eg">${esc(s.rcm)}</div>`;
}

const LOM_MODULES = BODY_SYSTEMS.map((s,i) => ({
  n:i+1, id:s.id, title:s.name,
  goal:`${s.roots.length} roots · ${s.conditions.length} conditions · ${s.procedures.length} procedures`,
  lesson:{ id:s.id+'-LESSON', filled:true, noVideo:true, body:systemBody(s) },
  quiz:{ id:s.id+'-AUDIT', filled:true, pass:PASS_MARK, draw:DRAW, pool:LOM_POOLS[s.id],

  <h3>What you are building</h3>
  <p>Typing without looking at your hands. Everything in the next twelve weeks sits on top of this. If you keep looking down, nothing else in the programme will work.</p>
  <h3>The rules — non-negotiable</h3>
  <ul>
   <li><b>Never look at the keyboard.</b> Cover your hands if you have to.</li>
   <li><b>Correct fingers only.</b> Two-finger speed has a ceiling you will hit in week three.</li>
   <li><b>Accuracy before speed.</b> Slow and correct beats fast and wrong, every time.</li>
   <li><b>Posture holds all day.</b> Screen at eye level, elbows near 90°, feet flat, wrists floating.</li>
  </ul>
  <h3>Daily practice</h3>
  <p>Monkeytype, 3-minute runs. Home row first, then top and bottom rows, then full sentences. Log your text WPM and accuracy every single day.</p>
  <h3>Why this matters in RCM</h3>
  <div class="eg">Every claim note, appeal letter and account note you will ever write goes through your hands. Speed here is not vanity — it is how many accounts you can close in a shift.</div>
  <h3>Your target at the end of Week 2</h3>
  <p>Text typing at <b>30 WPM with 95% accuracy</b>.</p>`,

 body:`
  <h3>What you are building</h3>
  <p>Speed on the number pad, on the exact strings you will type all day: member IDs, dollar amounts, dates of service.</p>
  <h3>Why the number target looks lower</h3>
  <p>40 WPM on numbers is as hard as 70–75 WPM on text. It is not an easier target.</p>
  <ul>
   <li><b>No word shapes.</b> Your hand knows the shape of "patient". 882134590001 has no shape — every digit is a separate decision.</li>
   <li><b>No context to catch errors.</b> "patietn" jumps out at you. 88213 typed as 88231 looks completely fine.</li>
   <li><b>One hand, not two.</b> Four fingers do the work instead of ten.</li>
  </ul>
  <p>That is also why the accuracy bar is higher on numbers. <b>In RCM, one wrong digit is a denied claim.</b></p>
  <h3>Chunking</h3>
  <p>Never read a long ID digit by digit. Break it into groups of three or four, type each group as a unit.</p>
  <div class="eg">882134590001 → <b>8821 · 3459 · 0001</b> — three movements, not twelve.</div>
  <h3>The verification habit</h3>
  <p>After every ID you type, read it back against the source once. Build this now, while you are slow. It is nearly impossible to add later.</p>

  <p>Paste these into Monkeytype under Settings → Custom text.</p>

  <div class="eg">Replace these with the real ID formats and payer mix from your own accounts. The drill only pays off when the characters match live work.</div>`,

  <h3>Layer 5 — Production systems</h3>

  <h3>Power tools</h3>

 goal:'Recall drill, working memory, code decks',
 body:`
  <h3>What does not work</h3>
  <p>Brain-training apps and puzzle games do not transfer to claim work. Skip them. What transfers is drilling the exact material you use on the job.</p>
  <h3>Drill 1 — Recall</h3>
  <p>The highest-return drill in the whole programme. Build spaced-repetition decks and run them daily.</p>
  ${keys([['Deck 1','Denial codes — 40 cards'],['Deck 2','CPT codes — 25 cards'],['Deck 3','Modifiers — 20 cards'],['Deck 4','Payer rules — 20 cards'],['Deck 5','Portal navigation paths — 15 cards']])}
  <p>For every denial code, the card must give <b>the meaning and the next action</b>. Meaning alone is not recall — it is trivia.</p>
  <h3>Drill 2 — Working memory</h3>
  <p>Hold a claim line in your head while you move between screens. Read a full line once, switch windows, then type it from memory. Check, then repeat with a longer line.</p>
  <h3>Daily drill blocks</h3>
  ${blk('b2','Block B2 — CPT / HCPCS codes')}
  ${blk('b3','Block B3 — ICD-10 codes')}
  ${blk('b4','Block B4 — Denial codes (CARC / RARC)')}
  ${blk('b5','Block B5 — Modifiers')}
  ${blk('b6','Block B6 — Payers, portals & clearinghouses')}
  <h3>From Week 7 — mixed claim lines, daily</h3>
  ${blk('b9','Block B9 — Mixed claim lines')}`,

{
 n:5, id:'MC-P5', title:'Integration — Scanning & Error Detection', weeks:'Weeks 9–10',
 goal:'EOB eye path, QA instinct, first simulations',
 body:`
  <h3>Drill 3 — Visual scanning (EOB / ERA)</h3>
  <p>This trains the eye path you will use all day. <b>Do not read the whole document.</b> Learn where each field sits on each payer's format and jump straight to it.</p>
  <p>On every EOB, find and record five things:</p>
  ${keys([['1','Allowed amount'],['2','Patient responsibility'],['3','Contractual adjustment'],['4','Denial / remark code'],['5','Date of service']])}
  ${keys([['Week 9 start','Under 45 seconds · 90% accuracy'],['Week 11','Under 25 seconds · 93% accuracy'],['Week 12 — Final Gate','Under 20 seconds · 95% accuracy']])}
  <h3>Drill 4 — Error detection</h3>
  <p>20 claim lines, 5 seeded errors. You are scored on catches <b>and</b> false alarms — flagging a clean claim wastes time too.</p>
  <p>The error types to look for:</p>
  <ul>
   <li>Transposed member ID digits (W123456789 → W123465789)</li>
   <li>DOB mismatch between claim and eligibility</li>
   <li>CPT / modifier mismatch</li>
   <li>Diagnosis does not support the procedure</li>
   <li>Date of service outside the coverage period</li>
   <li>Wrong payer for the plan shown</li>
   <li>Units mismatch</li>
  </ul>
  <h3>Drill 5 — Focus &amp; endurance</h3>
  <p>Not an exercise, a routine. It moves output more than any brain game.</p>
  <ul>
   <li><b>50 minutes work, 10 minutes break.</b> Break means standing and looking away from the screen.</li>
   <li><b>Phone off the desk</b> during focus blocks.</li>
   <li><b>20-20-20:</b> every 20 minutes, look 20 feet away for 20 seconds.</li>
   <li>Re-run the Week 1 posture check. Eight weeks in, habits have slipped.</li>
  </ul>
  <h3>Simulations start</h3>
  ${keys([['Week 9','Eligibility — 10 test patients'],['Week 9','Claim status — 10 claims, 2 portals'],['Week 10','Denial handling — 10 denials'],['Week 10','Payment posting — 15 EOB lines']])}
  <p>Every new simulation runs <b>untimed on its first day</b>. You need to see the shape of the task before speed is applied.</p>`,

 n:6, id:'MC-P6', title:'Production Simulation & Certification', weeks:'Weeks 11–12',
 goal:'Full workflow, Final Gate, certification',
 body:`
  <h3>Full workflow simulation</h3>
  <p>Five patients, run end to end: eligibility → claim status → denial → posting. Mice disconnected, clock running, Coach observing and not helping.</p>
  <h3>What tightens in these two weeks</h3>
  ${keys([['EOB scan','Under 20 seconds · 95% accuracy'],['Error detection','5 of 5 found · under 4 minutes · max 1 false alarm'],['Recall test','90% — the same test you took at Week 8, higher bar'],['Cheat sheets','Off the monitor. You should not need them.']])}
  <h3>The Final Gate</h3>
  <p>Four components, each worth 25%. Split across two days in Week 12, Coach and Manager both present.</p>
  ${keys([['Text typing','70–75 WPM at 98%'],['Number typing','40 WPM at 99%'],['Navigation','Practical Test B — full workflow, no mouse'],['Cognitive','Tests C, D and E — scan, error detection, recall']])}
  <p><b>Pass: 75% overall, with no single component below 60%.</b></p>
  <h3>If you fall short</h3>
  <p>One 2-week extension with a targeted plan, re-tested at the end of Week 14. Typing is a repairable skill and 14 weeks is a fair run at it. After that, the standard is the standard.</p>
  <h3>Merit tier</h3>
  <p>Text 85+ WPM at 98%, numbers 50+ WPM at 99%, and 100% on all practical tests. Recorded on your employee file and counts towards promotion.</p>
  <h3>After certification — the permanent routine</h3>
  ${keys([['Daily','10 minutes of drills at shift start'],['Monthly','Re-test typing speed and accuracy'],['Quarterly','Re-run the practical navigation test'],['Annually','Full re-certification']])}
  <div class="eg">The mechanical floor is the job. A trainee who cannot reach the bar after twelve weeks of daily coaching does not go to a client account, however good their claim judgement is.</div>`,
 check:{ id:'MC-P6-CHECK', type:'scorecard', title:'Final Gate', when:'Week 12 · Days 3–4',
  note:'Enter a score out of 100 for each component. Pass requires 75% overall AND no component below 60%.',
  pass:75, floor:60,
  components:[
   {id:'text',label:'Text typing — 70–75 WPM / 98%',weight:25,test:'Monkeytype, 3 min'},
   {id:'num', label:'Number typing — 40 WPM / 99%',weight:25,test:'Monkeytype numbers, 3 min'},

/* ============================================================
   SKYLIGHT OPS — the six core services
   Source: the six role SOPs. Written for someone new to RCM.
   Order follows the revenue cycle: money starts at the front
   desk and ends in a report.
   ============================================================ */
const steps = a => `<ol class="steps">${a.map(([t,d])=>`<li><b>${esc(t)}</b><span>${esc(d)}</span></li>`).join('')}</ol>`;
const chkl  = a => `<ul class="chk">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const warn  = a => `<ul class="warn">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const rule  = t => `<div class="rule"><span>The one rule</span><b>${esc(t)}</b></div>`;

const OPS = [
{
 id:'OPS-1', name:'Eligibility & Benefits Verification',
 tag:'Check the insurance is real, active, and will pay — before anyone is treated.',
 body:`
  <h3>What this job is</h3>
  <p>Before a patient is seen, you confirm two things: <b>is the insurance active on that exact day</b>, and <b>how much will the plan pay</b>. You then write it down in a form the clinic can act on.</p>
  <p>You are the first person in the money chain. Almost every denial that happens later can be traced back to something missed here.</p>
  ${rule('Verify before service. No coverage confirmed, no clean bill later.')}
  <h3>How the work reaches you</h3>
  <p>Most checks come back automatically from an electronic system. Your job is the part the machine cannot do: spotting when the answer is incomplete, catching services that need approval, and phoning the payer when the file is thin.</p>
  <div class="eg">About 94 out of 100 checks are electronic. You own the other 6 — and they are the ones that cause denials.</div>
  <h3>The work, step by step</h3>
  ${steps([
   ['Receive the patient details','Name, date of birth, insurance ID, and the date they are being seen.'],
   ['Pick your method','Electronic check for routine cases. Payer portal or phone call for anything unusual.'],
   ['Confirm coverage is active','Active on the exact date of service. Not last month. Not "generally active".'],
   ['Write down the benefits','Deductible left, copay, coinsurance, out-of-pocket maximum, in or out of network.'],
   ['Flag anything needing approval','If the service needs prior authorisation or a referral, say so clearly.'],
   ['Sort out multiple plans','If the patient has two insurances, record which one pays first.'],
   ['Check the personal details match','Name spelling, date of birth, and member ID exactly as the payer holds them.'],
   ['Escalate anything odd','Do not guess. Send unclear cases to your Team Lead.'],
   ['Build the benefit summary','One clean page the clinic can read in ten seconds.'],
   ['Deliver it on time','Same day for urgent. Within the agreed deadline for the rest.']
  ])}
  <h3>Check before you send</h3>
  ${chkl([
   'Coverage is active for the exact date of service',
   'Name, date of birth, address and ID match the payer records',
   'Deductible, copay, coinsurance, out-of-pocket max and network status all captured',
   'Prior authorisation or referral need is checked and flagged',
   'If two plans exist, the order of payment is set',
   'Subscriber ID and group number are correct'
  ])}
  <h3>Mistakes that cost money</h3>
  ${warn([
   'A stale check — coverage lapsed between the booking and the visit',
   'Wrong subscriber ID or date of birth',
   'Missing a required prior authorisation flag',
   'Recording "active" without recording what the plan actually pays'
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 45 minutes','Log in. Pull tomorrow\u2019s schedule. Run the batch check.'],
   ['Morning','Work the batch results. Confirm coverage, record benefits, flag approvals.'],
   ['Mid-day','Real-time checks for walk-ins and same-day add-ons.'],
   ['Afternoon','Build benefit summaries. Run the accuracy checklist.'],
   ['Last 30 minutes','Deliver everything due. Update the tracker. Set up tomorrow.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['Verification rate','98%+ of patients verified before service'],
   ['Eligibility denial rate','Under 2%'],
   ['Data accuracy','98%+ fields matching the payer'],
   ['Turnaround','Same day for urgent'],
   ['Auth flag accuracy','98%+ correctly identified']
  ])}`,
 qs:[
  {q:'What is the golden rule of verification?',opts:['Verify after the visit','Verify before service','Verify only for new patients','Verify once a month'],a:1},
  {q:'Coverage must be confirmed active for which date?',opts:['The date you check','The exact date of service','The first of the month','The date of booking'],a:1},
  {q:'A patient has two insurance plans. What must you record?',opts:['Only the more expensive one','Which plan pays first','Nothing, billing decides','Only the newer plan'],a:1},
  {q:'You cannot get a clear answer from the electronic check. What next?',opts:['Mark it active and move on','Use the payer portal or call the payer','Skip the patient','Wait until after the visit'],a:1},
  {q:'Roughly what share of eligibility checks are handled electronically?',opts:['About 40%','About 60%','About 94%','About 100%'],a:2},
  {q:'Which of these belongs in the benefit summary?',opts:['The doctor\u2019s lunch break','Deductible remaining and copay','The clinic address','The referring fax number'],a:1},
  {q:'What is a "stale check"?',opts:['A check done too quickly','Coverage lapsed between booking and the visit','A check done by a trainee','A check on paper'],a:1},
  {q:'You spot a discrepancy you cannot explain. What is correct?',opts:['Use your best guess','Escalate to the Team Lead','Leave the field blank','Ask the patient to decide'],a:1},
  {q:'What is the target for eligibility-related denials?',opts:['Under 2%','Under 10%','Under 25%','No target'],a:0},
  {q:'Why does demographic accuracy matter so much?',opts:['It looks tidy','A mismatch with payer records causes a denial later','It speeds up typing','It is required by law only'],a:1},
  {q:'Which is NOT part of documenting benefits?',opts:['Out-of-pocket maximum','Network status','Coinsurance','The patient\u2019s employer name'],a:3},
  {q:'"Out-of-pocket maximum" means:',opts:['The most the plan will ever pay','The most the patient pays in a year before the plan covers everything','The copay per visit','The deductible only'],a:1},
  {q:'A service needs prior authorisation. Whose job is it to flag that?',opts:['The coder','The verification specialist','The patient','Nobody'],a:1},
  {q:'What is the turnaround standard for an urgent verification?',opts:['Within a week','Same day','Within 48 hours','No standard'],a:1},
  {q:'Why is verification called the first link in the money chain?',opts:['It is the easiest job','Errors here become denials at every later stage','It pays the most','It happens last'],a:1}
 ]
},
{
 id:'OPS-2', name:'Prior Authorization',
 tag:'Get the payer to say yes in writing — before the service happens.',
 body:`
  <h3>What this job is</h3>
  <p>Some services need the insurance company to approve them in advance. You find out which ones, gather the medical proof, submit the request, chase the answer, and attach the approval number to the bill.</p>
  ${rule('No approved authorisation, no service. And no service billed without the auth number linked to it.')}
  <h3>What makes this job hard</h3>
  <p>The rules change by payer, by plan, and by service. The same procedure can need approval under one plan and not under another. Never work from memory — check the specific payer and plan every time.</p>
  <h3>The work, step by step</h3>
  ${steps([
   ['Find out if approval is needed','Check the exact payer and the exact plan for that service code.'],
   ['Gather the medical proof','Doctor\u2019s notes, test results, treatments already tried, and why they did not work.'],
   ['Write the medical necessity letter','Only when the payer asks for one. Say clearly why this patient needs this service now.'],
   ['Submit the request','Through the payer portal, electronic channel, or fax — whichever that payer accepts.'],
   ['Chase it','Do not wait silently. Follow up on a schedule until you get an answer.'],
   ['Record the decision','Approved, denied, or pended. Write down the number, the approved codes, the units, and the valid dates.'],
   ['Arrange a peer-to-peer review','If denied, the treating doctor speaks directly to the payer\u2019s doctor. You set that call up.'],
   ['Link the approval to the claim','This is the step most often missed. Without it, the approval is worthless.'],
   ['Watch the expiry date','Authorisations run out. Renew before they lapse, not after.'],
   ['Log everything','Every request, decision and date goes in the log.']
  ])}
  <h3>Check before it goes to billing</h3>
  ${chkl([
   'The requirement was confirmed for that specific payer and plan',
   'The authorisation is approved and active for the date of service',
   'The approved codes and units match the service actually given',
   'The authorisation number is linked to the claim',
   'The authorisation has not expired'
  ])}
  <h3>Mistakes that cost money</h3>
  ${warn([
   'Not realising authorisation was needed in the first place',
   'Wrong codes or wrong number of units on the request',
   'Submitting to the wrong payer or the wrong channel',
   'Missing the payer\u2019s decision or appeal deadline',
   'Getting the approval but never linking it to the claim'
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 45 minutes','Log in. Pull new and pending authorisation work.'],
   ['Morning','Determine what needs approval. Gather documents. Submit new requests. Urgent cases first.'],
   ['Mid-day','Follow up on pending requests. Record decisions. Send extra information where asked.'],
   ['Afternoon','Set up peer-to-peer reviews. Work denials and appeals. Link approvals to claims.'],
   ['Last 30 minutes','Update the log. Check upcoming expiries. Set up tomorrow.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['Turnaround','Submit the same day the order arrives'],
   ['Auth denial rate','Denials from missing or invalid auth kept low'],
   ['Auth linked to claim','Close to 100%'],
   ['Renewal compliance','Close to 100% — never let one lapse'],
   ['Overturn rate','Track and improve appeals and peer-to-peers']
  ])}`,
 qs:[
  {q:'What is the golden rule of prior authorisation?',opts:['Submit after the service','No approved auth, no service','Only authorise expensive services','Authorise once per patient'],a:1},
  {q:'How do you decide whether a service needs authorisation?',opts:['From memory','Check the specific payer and plan','Ask the patient','Assume yes'],a:1},
  {q:'Which step is most often missed and makes the whole approval worthless?',opts:['Gathering documents','Linking the auth number to the claim','Writing the request','Logging it'],a:1},
  {q:'What is a peer-to-peer review?',opts:['Two coders checking each other','The treating doctor speaking to the payer\u2019s doctor','A team meeting','A patient interview'],a:1},
  {q:'An authorisation approved 12 units, but 15 were given. What is the risk?',opts:['No risk','The extra units will likely deny','The patient pays nothing','The claim auto-corrects'],a:1},
  {q:'What should a medical necessity letter explain?',opts:['The clinic\u2019s revenue targets','Why this patient needs this service now, and what was already tried','The coder\u2019s qualifications','The payer\u2019s history'],a:1},
  {q:'An authorisation is close to its expiry date and treatment continues. What do you do?',opts:['Wait for it to lapse then reapply','Renew before it lapses','Bill without it','Nothing'],a:1},
  {q:'A request is "pended". What does that mean?',opts:['It was approved','It was denied','The payer wants more information before deciding','It was lost'],a:2},
  {q:'What information must be recorded when a decision arrives?',opts:['Only approved or denied','The number, approved codes, units, and valid dates','Just the date','The payer\u2019s phone number'],a:1},
  {q:'Which denial codes usually point to an authorisation problem?',opts:['CARC 197 / 198','CARC 45','PR-1','N130'],a:0},
  {q:'The payer only accepts requests by fax. What do you do?',opts:['Send by portal anyway','Use fax — the channel that payer accepts','Email it','Skip the request'],a:1},
  {q:'Why does chasing matter?',opts:['It looks busy','Silence is not approval, and deadlines pass','The payer likes reminders','It boosts productivity numbers'],a:1},
  {q:'What is a retrospective authorisation?',opts:['One requested after the service, where the payer allows it','A cancelled authorisation','A renewal','A duplicate'],a:0},
  {q:'A denial arrives with an appeal deadline. What is the risk of missing it?',opts:['None','The right to appeal is lost and the money is written off','It resets automatically','The payer extends it'],a:1},
  {q:'Who owns the exceptions — peer-to-peers, appeals and complex cases?',opts:['The automation tools','The specialist','The patient','The clearinghouse'],a:1}
 ]
},
{
 id:'OPS-3', name:'Medical Coding',
 tag:'Turn what the doctor wrote into the codes that get paid.',
 body:`
  <h3>What this job is</h3>
  <p>You read the clinical note and translate it into codes: <b>ICD-10-CM</b> for what is wrong with the patient, and <b>CPT/HCPCS</b> for what was done about it. Those codes decide whether the claim is paid and how much.</p>
  ${rule('Code only what is documented. If it is not written down, it did not happen — ask the doctor, never assume.')}
  <h3>The two code sets</h3>
  ${keys([
   ['ICD-10-CM','The diagnosis — what is wrong. Example: E11.9, type 2 diabetes.'],
   ['CPT / HCPCS','The procedure — what was done. Example: 99214, an office visit.'],
   ['Modifiers','Two-character add-ons that explain a special circumstance. Example: -25, -59, -LT.']
  ])}
  <h3>The work, step by step</h3>
  ${steps([
   ['Receive the note','Pull the chart from the coding worklist.'],
   ['Read it properly','Read the whole note, not just the assessment line. Detail hides in the body.'],
   ['Assign the diagnosis codes','Use the highest level of detail the note supports. Put the main reason for the visit first.'],
   ['Assign the procedure codes','Match exactly what was done. Add modifiers only where the note supports them.'],
   ['Run the edit checks','NCCI and local coverage rules catch code pairs that cannot be billed together.'],
   ['Query the doctor','If the note is unclear or incomplete, ask. Never guess and never lead the answer.'],
   ['Do the risk-adjustment review','For Medicare Advantage charts, capture chronic conditions documented that year.'],
   ['Submit for QA','A second pair of eyes before the chart moves on.'],
   ['Finalise and send to claims','Only once every code is supported.']
  ])}
  <h3>Check before you finalise</h3>
  ${chkl([
   'Codes are at the highest specificity — side of the body and 7th character where required',
   'Diagnoses are in the right order, main reason for the visit first',
   'Modifiers are correct and supported by the note',
   'NCCI edits and coverage rules are checked and resolved',
   'Every single code is backed by something written in the record',
   'Any gap was queried, not guessed'
  ])}
  <h3>Mistakes that cost money</h3>
  ${warn([
   'Picking a visit level by how long the note is instead of the medical decision making',
   'Unbundling — billing separately for things that belong to one combined code',
   'Missing a required modifier such as -25 or -59',
   'Coding from the history instead of the assessment',
   'Assuming a link between two conditions the doctor never documented'
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 30 minutes','Log in. Pull the worklist. High-value and aging charts first.'],
   ['Morning','Code encounters. Assign diagnoses and procedures. Apply modifiers and edits.'],
   ['Mid-day','Send and chase physician queries. Complete risk-adjustment reviews.'],
   ['Afternoon','Submit charts for QA. Apply the feedback. Route approved charts to claims.'],
   ['Last 30 minutes','Update the productivity and query logs. Note anything held.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['Coding accuracy','95%+ on audit, elite teams 97%+'],
   ['Audit pass rate','95%+'],
   ['Turnaround','Within the client deadline'],
   ['Query handling','Sent when appropriate, resolved on time'],
   ['Productivity','Charts per day, set by specialty']
  ])}`,
 qs:[
  {q:'What is the golden rule of coding?',opts:['Code what is likely','Code only what is documented','Code the highest paying option','Code from the history'],a:1},
  {q:'Which code set describes what is wrong with the patient?',opts:['CPT','ICD-10-CM','HCPCS','NCCI'],a:1},
  {q:'Which code set describes what was done for the patient?',opts:['ICD-10-CM','CPT / HCPCS','CARC','LCD'],a:1},
  {q:'The note is unclear about a diagnosis. What is correct?',opts:['Choose the most likely code','Query the physician','Leave it uncoded forever','Use an unspecified code always'],a:1},
  {q:'What does "unbundling" mean?',opts:['Billing separately for services that belong to one combined code','Removing a modifier','Splitting a claim by date','Sending two claims to two payers'],a:0},
  {q:'How should an office visit level be selected?',opts:['By the length of the note','By medical decision making, or time','By the patient\u2019s age','By the payer'],a:1},
  {q:'What are NCCI edits for?',opts:['Checking spelling','Catching code pairs that cannot be billed together','Setting prices','Verifying insurance'],a:1},
  {q:'"Highest specificity" means:',opts:['The longest code available','As much detail as the documentation supports, including side of body','Always using unspecified codes','The most expensive code'],a:1},
  {q:'Which diagnosis is sequenced first?',opts:['The oldest one','The main reason for the visit','The most expensive','Alphabetically'],a:1},
  {q:'A coder uses AI-suggested codes. Who is accountable for them?',opts:['The AI vendor','The coder','The payer','The physician'],a:1},
  {q:'What is a physician query?',opts:['A complaint about a doctor','A request to the doctor to clarify or complete documentation','A payer question','An audit finding'],a:1},
  {q:'When writing a query, what must you avoid?',opts:['Being polite','Leading the physician to a particular answer','Attaching the chart','Recording it'],a:1},
  {q:'What is HCC / risk-adjustment coding for?',opts:['Commercial claims only','Capturing chronic conditions each year for Medicare Advantage','Setting copays','Denial appeals'],a:1},
  {q:'What is the coding accuracy target?',opts:['80%+','90%+','95%+','100% only'],a:2},
  {q:'A patient has diabetes and kidney disease. When can you code them as linked?',opts:['Always','Only when the documentation or an official coding rule supports it','Never','If the codes are adjacent'],a:1}
 ]
},
{
 id:'OPS-4', name:'Medical Billing & Claims',
 tag:'Build the claim, clean it, send it, and make sure the payer accepted it.',
 body:`
  <h3>What this job is</h3>
  <p>You take the coded visit and turn it into a claim the insurance company can process. Then you check it for errors, send it, and confirm it arrived and was accepted.</p>
  ${rule('Clean claim, first time. Fix every error before it leaves — a dirty claim comes back and costs twice.')}
  <h3>Rejection is not denial</h3>
  <p>People mix these up constantly. Learn the difference on day one.</p>
  ${keys([
   ['Rejection','The claim never got in. It failed a format or field check at the clearinghouse or payer front door. Fix it and resend — it was never officially received.'],
   ['Denial','The claim got in, was processed, and the payer decided not to pay. This needs an appeal, not a resend.']
  ])}
  <h3>The work, step by step</h3>
  ${steps([
   ['Receive the coded encounter','It arrives from the coding team, ready to bill.'],
   ['Build the claim','Patient details, provider and NPI, payer, dates of service, codes, charges.'],
   ['Scrub it before sending','Run it through the checking engine. Catch errors while they are still free to fix.'],
   ['Resolve every edit','Do not override an edit you do not understand. Find out why it fired.'],
   ['Submit','Send electronically to the clearinghouse, which routes it to the payer.'],
   ['Confirm acceptance','Sending is not the same as arriving. Check the acknowledgement report.'],
   ['Work rejections first','A rejection is the fastest money in the building. Correct and resend within 24 hours.'],
   ['File secondary claims','When a second plan exists, send it the primary payer\u2019s explanation of benefits.'],
   ['Watch the filing deadline','Every payer has a window. Miss it and the money is gone permanently.'],
   ['Log and report','Record what went out, what was accepted, and what is at risk.']
  ])}
  <h3>Check before you submit</h3>
  ${chkl([
   'All required fields complete — patient, provider and NPI, payer ID, dates, charges',
   'Codes and modifiers valid and passing the edit checks',
   'Authorisation number present and linked where required',
   'The claim is not a duplicate',
   'The claim is inside the payer\u2019s filing window',
   'Correct payer, and the right order if there are two plans'
  ])}
  <h3>Mistakes that cost money</h3>
  ${warn([
   'Patient name, date of birth or member ID not matching the payer\u2019s records',
   'Missing or wrong authorisation number',
   'Modifier or edit errors pushed through without being understood',
   'Duplicate claims',
   'Letting the filing deadline pass'
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 45 minutes','Log in. Check overnight acknowledgements and rejection reports.'],
   ['Morning','Work rejections first — correct and resend within 24 hours. Then build and scrub new claims.'],
   ['Mid-day','Submit clean claims. Confirm acceptance on the batches you sent.'],
   ['Afternoon','File secondary claims with the primary explanation of benefits. Resolve edits sent back to you.'],
   ['Last 30 minutes','Update the submission log. Flag tomorrow\u2019s filing deadline risks.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['Clean claim rate','95%+, elite teams 98%+'],
   ['Rejection rate','Under 5%'],
   ['Rejection turnaround','Corrected and resent within 24 hours'],
   ['Timely filing','Close to 100%'],
   ['Productivity','Claims per day, set by client']
  ])}`,
 qs:[
  {q:'What is the golden rule of claims?',opts:['Send fast, fix later','Clean claim, first time','Send twice to be safe','Wait for the payer to ask'],a:1},
  {q:'What is the difference between a rejection and a denial?',opts:['They are the same','A rejection never entered the payer system; a denial was processed and refused','A denial is smaller','A rejection needs an appeal'],a:1},
  {q:'A rejection arrives. What is the correct response?',opts:['Appeal it','Correct and resubmit within 24 hours','Write it off','Wait 30 days'],a:1},
  {q:'What is the clean claim rate target?',opts:['70%+','85%+','95%+','100% only'],a:2},
  {q:'Why work rejections before building new claims?',opts:['They are more interesting','It is the fastest money available','The system forces it','It is not a priority'],a:1},
  {q:'What happens if the timely filing deadline passes?',opts:['The payer sends a reminder','The money is usually lost permanently','It resets','Interest is added'],a:1},
  {q:'An edit fires that you do not understand. What do you do?',opts:['Override it','Find out why it fired and resolve it properly','Delete the line','Send it anyway'],a:1},
  {q:'Submitting a claim means it has been accepted. True or false?',opts:['True','False — you must confirm acceptance on the acknowledgement report','True for electronic only','True for Medicare only'],a:1},
  {q:'What must be attached when billing a secondary payer?',opts:['Nothing extra','The primary payer\u2019s explanation of benefits','A new authorisation','The patient\u2019s ID card'],a:1},
  {q:'What does a clearinghouse do?',opts:['Pays claims','Checks format and routes claims to the right payer','Codes charts','Verifies eligibility only'],a:1},
  {q:'Which is a common cause of rejection?',opts:['Demographic mismatch with payer records','A long note','A busy clinic','A new coder'],a:0},
  {q:'What is a duplicate claim risk?',opts:['It doubles the payment','It is rejected or flagged and wastes rework time','It speeds up payment','It has no effect'],a:1},
  {q:'What is the rejection rate target?',opts:['Under 5%','Under 20%','Under 40%','No target'],a:0},
  {q:'Where does the coded encounter come from?',opts:['The payer','The coding team','The patient','The clearinghouse'],a:1},
  {q:'Why is scrubbing done before submission and not after?',opts:['It is faster to type','Errors caught before sending are free; errors caught after cost rework','The payer requires it','It is not important'],a:1}
 ]
},
{
 id:'OPS-5', name:'AR Follow-Up & Denial Management',
 tag:'Chase the money that has not arrived, and stop the same denial happening again.',
 body:`
  <h3>What this job is</h3>
  <p>Claims were sent. Some were not paid, paid late, or paid short. You find out why, fix it, appeal where needed, and then feed the cause back upstream so it stops repeating.</p>
  <p><b>AR</b> means accounts receivable — money billed but not yet collected.</p>
  ${rule('Every account you touch gets an action and a note. Never leave an account you looked at without recording what happens next.')}
  <h3>The part people miss</h3>
  <p>Collecting the money is only half the job. The other half is <b>prevention</b> — telling the eligibility, authorisation and coding teams what keeps causing denials, so the same claim stops failing.</p>
  <div class="eg">Working a denial gets you paid once. Fixing its cause gets you paid every time after that.</div>
  <h3>The work, step by step</h3>
  ${steps([
   ['Pull the work queue','Get the aging report — what is unpaid and how old it is.'],
   ['Prioritise','High dollar value and approaching deadlines first. Not oldest to newest.'],
   ['Investigate','Read the claim, the explanation of benefits, and the notes. Understand what actually happened.'],
   ['Confirm with the payer','Portal first. Call only when the portal cannot answer it.'],
   ['Resolve or escalate','Fix what you can. Send what you cannot to your Team Lead with the facts.'],
   ['Build the appeal','Cover letter, original claim, the denial notice, and the clinical proof.'],
   ['Track the appeal','Appeals have deadlines too. Follow up on a schedule.'],
   ['Post the payment or escalate again','When money arrives, record it. When it does not, go up a level.'],
   ['Find the root cause','Not "denied" — why. Which team, which step, which payer, which code.'],
   ['Feed prevention upstream','Report the cause to the team that can stop it.']
  ])}
  <h3>What goes in an appeal package</h3>
  ${chkl([
   'Cover letter stating exactly what decision you are challenging and why',
   'Copy of the original claim',
   'The explanation of benefits showing the denial or short payment',
   'Supporting clinical records — physician notes, operative reports, lab results',
   'Authorisation records where relevant',
   'Coding references — the guideline or edit that supports your position',
   'Payer contract wording, for underpayment disputes'
  ])}
  <h3>On the phone with a payer</h3>
  ${keys([
   ['Before you dial','Have the claim, the patient details and the denial reason open in front of you.'],
   ['Always get','The representative\u2019s name and the call reference number.'],
   ['Ask for specifics','Not "why was it denied" but "which field failed and what do you need to reprocess it".'],
   ['After the call','Write the note immediately, while it is fresh.']
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 45 minutes','Log in. Pull the aging report. Sort by value and deadline.'],
   ['Morning','Work the highest-value and closest-to-deadline accounts. Investigate and act.'],
   ['Mid-day','Payer calls and portal follow-ups on anything the systems could not answer.'],
   ['Afternoon','Build and submit appeals. Track appeals already filed.'],
   ['Last 30 minutes','Update account notes. Log denial root causes for the weekly report.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['Days in AR','Under 35, elite teams under 30'],
   ['AR over 90 days','Under 10% of total AR'],
   ['Initial denial rate','Under 5%, elite under 3%'],
   ['Denial overturn rate','50–70%+ of appeals won'],
   ['First-pass resolution','90%+ paid on first submission']
  ])}`,
 qs:[
  {q:'What does AR stand for?',opts:['Automated Review','Accounts Receivable','Appeal Request','Authorisation Record'],a:1},
  {q:'How should accounts be prioritised?',opts:['Oldest first, always','High dollar value and approaching deadlines first','Alphabetically','Newest first'],a:1},
  {q:'What is the difference between working a denial and preventing one?',opts:['No difference','Working it gets paid once; preventing it stops the whole pattern','Prevention is the payer\u2019s job','Working it is optional'],a:1},
  {q:'What must every account you touch receive?',opts:['A phone call','An action and a note','An appeal','A write-off'],a:1},
  {q:'What are the two things you must always get on a payer call?',opts:['The hold time and the music','The representative\u2019s name and the call reference number','The payer\u2019s address','The claim total'],a:1},
  {q:'Which is the better question to ask a payer?',opts:['"Why was it denied?"','"Which field failed and what do you need to reprocess it?"','"Can you pay it now?"','"Who is your manager?"'],a:1},
  {q:'What is the target for AR over 90 days?',opts:['Under 10% of total AR','Under 40%','Under 60%','No target'],a:0},
  {q:'What must an appeal cover letter state?',opts:['The clinic\u2019s revenue goal','Exactly what decision is being challenged and why','The coder\u2019s name','The patient\u2019s address only'],a:1},
  {q:'What is an underpayment?',opts:['A claim that was denied','A claim paid less than the contracted rate','A claim not yet sent','A duplicate payment'],a:1},
  {q:'Root cause analysis means recording:',opts:['That the claim was denied','Which team, step, payer and code caused it','The date only','The dollar amount only'],a:1},
  {q:'What is the denial overturn rate target?',opts:['10–20%','50–70%+','Under 5%','100%'],a:1},
  {q:'When should you call a payer rather than use the portal?',opts:['Always','Only when the portal cannot answer the question','Never','Once per account'],a:1},
  {q:'An appeal deadline is approaching. What is the risk of missing it?',opts:['None, it can be refiled','The appeal right is lost and the money is written off','The payer extends it','It becomes a rejection'],a:1},
  {q:'What is the Days in AR target?',opts:['Under 35','Under 90','Under 120','No target'],a:0},
  {q:'Who should receive the denial root-cause report?',opts:['Nobody','The upstream teams who can stop the cause','The patient','The clearinghouse'],a:1}
 ]
},
{
 id:'OPS-6', name:'Reporting & Revenue Analytics',
 tag:'Turn the numbers into a decision someone can actually make.',
 body:`
  <h3>What this job is</h3>
  <p>You pull the data, check it is right, find what it means, and write down what should be done about it. A report is not a wall of numbers — it is a recommendation with evidence attached.</p>
  ${rule('No passive reports. Every report needs an Owner, a Target, and an Action. A report nobody acts on is wasted work.')}
  <h3>The four levels of analytics</h3>
  <p>Know which level you are working at. Most teams start at 1 and 2.</p>
  ${keys([
   ['1. Descriptive — what happened?','"Denials were 7% last week."'],
   ['2. Diagnostic — why?','"Because Aetna authorisation denials doubled."'],
   ['3. Predictive — what next?','"These 40 claims are likely to deny."'],
   ['4. Prescriptive — what should we do?','"Run a daily auth check for Aetna. Should cut denials by about 3%."']
  ])}
  <h3>The work, step by step</h3>
  ${steps([
   ['Confirm what is being asked','Agree the exact metrics and the exact date range before you touch the data.'],
   ['Collect the data','Pull from the agreed source. Same source every time, or the numbers will not match.'],
   ['Validate and clean','Check the totals tie back to the source. Remove duplicates.'],
   ['Build it','Make it readable. One clear message per view.'],
   ['Find the story','A number alone means nothing. What changed, and compared to what?'],
   ['Write the action items','For each finding: who owns it, what good looks like, what to do next.'],
   ['Quality check','Run the reconciliation checklist. Get a second pair of eyes.'],
   ['Deliver on time','A late report is a report nobody used.'],
   ['Walk it through','Present it. Answer questions. Confirm the owner accepted the action.'],
   ['Maintain and improve','Track whether the actions were done and whether the number moved.']
  ])}
  <h3>Check before you publish</h3>
  ${chkl([
   'Totals match the trusted source — payments tie to posting, charges tie to billing',
   'Counts match the source — claim counts and patient counts',
   'The date range is exactly right, no extra or missing days',
   'No duplicate rows and no double-counted claim lines',
   'No blanks in key fields — payer, amount, date',
   'Each metric uses the agreed formula'
  ])}
  <h3>Mistakes that cost credibility</h3>
  ${warn([
   'Wrong or shifted date range',
   'Mixing "posted" with "paid", or "billed" with "allowed"',
   'Double-counting line items on multi-line claims',
   'Publishing a number you cannot trace back to its source',
   'Delivering findings with no recommended action'
  ])}
  <h3>Your day</h3>
  ${keys([
   ['First 45 minutes','Log in. Pull yesterday\u2019s data. Build and reconcile the daily report.'],
   ['Morning','Quality check the daily report and deliver it before the client deadline.'],
   ['Mid-day','Work the scheduled weekly or monthly report — collect, validate, build, analyse.'],
   ['Afternoon','Write the action items. Run the reconciliation checklist. Get it reviewed.'],
   ['Last 30 minutes','Save versioned copies. Update the action tracker. Confirm tomorrow\u2019s deadlines.']
  ])}
  <h3>How you are measured</h3>
  ${keys([
   ['On-time delivery','100%'],
   ['Report accuracy','99%+ — zero published errors is the goal'],
   ['Action items included','100% of weekly and monthly reports'],
   ['Reconciliation completed','100%, documented every time']
  ])}`,
 qs:[
  {q:'What is the golden rule of reporting?',opts:['More charts is better','No passive reports — every report needs an Owner, Target and Action','Send reports weekly','Use colour coding'],a:1},
  {q:'"Denials were 7% last week" is which level of analytics?',opts:['Descriptive','Diagnostic','Predictive','Prescriptive'],a:0},
  {q:'"These 40 claims are likely to deny" is which level?',opts:['Descriptive','Diagnostic','Predictive','Prescriptive'],a:2},
  {q:'What must be agreed before you touch the data?',opts:['The chart colours','The exact metrics and the exact date range','The file name','The delivery email'],a:1},
  {q:'What does reconciliation mean here?',opts:['Apologising for errors','Checking the totals tie back to the trusted source','Merging two files','Deleting old data'],a:1},
  {q:'Why must you use the same data source every time?',opts:['It is faster','Otherwise the numbers will not match between reports','The client asked','It saves storage'],a:1},
  {q:'What is wrong with mixing "posted" and "paid"?',opts:['Nothing','They mean different things and the report becomes wrong','Only the spelling','They are the same'],a:1},
  {q:'A finding is delivered with no recommendation. What is the problem?',opts:['Nothing','Nobody knows what to do, so nothing changes','It is too short','It is too long'],a:1},
  {q:'What is the on-time delivery target?',opts:['80%','90%','95%','100%'],a:3},

/* ---------- state ---------- */
let KEY='skylight_lms_state';
let S={role:'learner',progress:{},audits:{},sets:{},bench:{},draft:{},bdraft:{},hist:{},route:null,preview:false};
let route={view:'dash',track:null,item:null};
let draftAudit={}, lastKey='';
const draft = new Proxy({},{get:(_,k)=>S.draft[k],set:(_,k,v)=>{S.draft[k]=v;return true},
  has:(_,k)=>k in S.draft, deleteProperty:(_,k)=>{delete S.draft[k];return true}});

async function waitStorage(limit){
  const t0=Date.now();
  while(!window.storage && Date.now()-t0<(limit||6000)) await new Promise(r=>setTimeout(r,25));
  return !!window.storage;
}
const napms = ms => new Promise(r=>setTimeout(r,ms));

/* Which keys actually exist. Lets us tell a genuine first run apart from a
   failed read — the difference between "new user" and "signed out by mistake" —
   and avoids burning retries on keys that were never written. */
let KEYS=null, noList=false;
async function keyList(force){
  if(KEYS && !force) return KEYS;
  if(noList || !window.storage || typeof window.storage.list!=='function'){ noList=true; return null; }
  for(let i=0;i<3;i++){
    try{
      const l=await window.storage.list('skylight');
      if(l && Array.isArray(l.keys)){ KEYS=l.keys; return KEYS; }
    }catch(e){}
    await napms(80*(i+1));
  }
  noList=true;                       // stop asking; fall back to plain reads
  return null;
}
/* Absent key -> return empty immediately. Present key -> read with retries. */
async function readKey(key){
  const keys=await keyList();
  if(keys && !keys.includes(key)) return {ok:true, value:null};
  return await sget(key, keys?5:2);
}
/* Read with retries. Returns {ok, value}. ok=false means we could not read,
   which is NOT the same as an empty value and must never sign anyone out. */
async function sget(key,tries){
  tries=tries||5;
  for(let i=0;i<tries;i++){
    try{
      const r=await window.storage.get(key);
      return {ok:true, value:(r && r.value) ? r.value : null};
    }catch(e){}
    if(i<tries-1) await napms(80*(i+1));
  }
  return {ok:false, value:null};
}
/* Write with retries so a transient failure does not lose the session. */
async function sset(key,value,tries){
  tries=tries||4;
  for(let i=0;i<tries;i++){
    try{
      await window.storage.set(key,value);
      if(KEYS && !KEYS.includes(key)) KEYS.push(key);
      return true;
    }
    catch(e){ await napms(120*(i+1)); }
  }
  console.error('storage write failed for',key);
  return false;
}
async function load(){
  await waitStorage();
  const r=await readKey(KEY);
  if(r.ok && r.value){ try{ S=Object.assign(S,JSON.parse(r.value)); }catch(e){} }
  S.sets=S.sets||{}; S.progress=S.progress||{}; S.audits=S.audits||{}; S.bench=S.bench||{};
  S.draft=S.draft||{}; S.bdraft=S.bdraft||{}; S.hist=S.hist||{};
}
let saveTimer=null, queueTimer=null;
async function save(quiet,forKey){
  if(!window.storage) return;
  const k=forKey||KEY;
  if(k!==KEY) return;                       // account changed since this was queued — drop it
  try{
    await sset(k,JSON.stringify(S));
    if(quiet) return;
    const el=document.getElementById('saving');
    el.classList.add('show'); clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>el.classList.remove('show'),1400);
  }catch(e){ console.error('Could not save',e); }
}
function touch(){
  clearTimeout(queueTimer);
  const k=KEY;                              // remember whose data this is
  queueTimer=setTimeout(()=>save(true,k),350);
}
async function flushSave(){ clearTimeout(queueTimer); queueTimer=null; await save(true,KEY); }
function flushNow(){
  if(!queueTimer || !window.storage || !me()) return;
  clearTimeout(queueTimer); queueTimer=null;
  try{ window.storage.set(KEY,JSON.stringify(S)); }catch(e){}   // best effort, no await
}
window.addEventListener('pagehide',flushNow);
window.addEventListener('beforeunload',flushNow);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushNow(); });

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const track=id=>TRACKS.find(t=>t.id===id);
const isDone=id=>!!(S.progress[id]&&S.progress[id].done);
const quizPassed=q=>{const p=S.progress[q.id];return !!(p&&p.done&&p.pct>=q.pass);};
const moduleDone=m=>isDone(m.lesson.id)&&quizPassed(m.quiz);
const auditDone=a=>!!S.audits[a.id];

function shuffled(total,n){
  const idx=[...Array(total).keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.slice(0, n===undefined?total:Math.min(n,total));   // order stays shuffled
}
/* The order is stored per attempt, so a reload mid-quiz shows the same sequence,
   and only a retake reshuffles. Answers and options themselves never change. */
function quizQs(quiz){
  const src = quiz.qs || quiz.pool;
  const n   = quiz.qs ? quiz.qs.length : Math.min(quiz.draw, quiz.pool.length);
  if(!S.sets[quiz.id] || S.sets[quiz.id].length!==n){
    S.sets[quiz.id]=shuffled(src.length,n); touch();
  }
  return S.sets[quiz.id].map(i=>src[i]);
}
function needed(quiz){ const n=quiz.draw||(quiz.qs?quiz.qs.length:0); return Math.ceil(quiz.pass*n/100); }

/* ---------- benchmark checkpoints (M&C) ---------- */
function benchOK(chk,st){
  st = st || S;
  const r = st.bench && st.bench[chk.id];
  if(!r || !r.done) return false;
  if(chk.type==='scorecard'){
    const tot = chk.components.reduce((s,c)=>s + (r.v[c.id]||0)*c.weight/100, 0);
    return tot >= chk.pass && chk.components.every(c=>(r.v[c.id]||0) >= chk.floor);
  }
  const mOK = chk.metrics.every(m => m.dir==='max' ? (r.v[m.id] <= m.target) : (r.v[m.id] >= m.target));
  const cOK = (chk.checks||[]).every(c => r.c && r.c[c.id]);
  return mOK && cOK;
}
function benchScore(chk){
  const r = S.bench && S.bench[chk.id];
  if(!r||!r.done) return null;
  if(chk.type==='scorecard')
    return Math.round(chk.components.reduce((s,c)=>s+(r.v[c.id]||0)*c.weight/100,0));
  const total = chk.metrics.length + (chk.checks||[]).length;
  let hit = chk.metrics.filter(m=>m.dir==='max'?(r.v[m.id]<=m.target):(r.v[m.id]>=m.target)).length;
  hit += (chk.checks||[]).filter(c=>r.c&&r.c[c.id]).length;
  return Math.round(hit/total*100);
}
function benchModuleDone(m){ return isDone(m.lesson.id) && benchOK(m.check); }

function moduleUnlocked(t,i){
  if(!t.lockstep||i===0) return true;
  const prev=t.modules[i-1];
  return t.bench ? benchOK(prev.check) : quizPassed(prev.quiz);
}
function trackPct(t,st){
  st = st || S;
  if(!t.built) return 0;
  const units=t.modules.length*2+(t.audits||[]).length; let hit=0;
  t.modules.forEach(m=>{
    const L=st.progress[m.lesson.id]; if(L&&L.done)hit++;
    if(t.bench){ if(benchOK(m.check,st))hit++; }
    else { const Q=st.progress[m.quiz.id]; if(Q&&Q.done&&Q.pct>=m.quiz.pass)hit++; }
  });
  (t.audits||[]).forEach(a=>{ if(st.audits&&st.audits[a.id])hit++; });
  return units?Math.round(hit/units*100):0;
}
function moduleState(t,m,st){
  st = st || S;
  const L=st.progress[m.lesson.id], read=!!(L&&L.done);
  if(t.bench){ const ok=benchOK(m.check,st), rec=st.bench[m.check.id];
    return {read, done:ok, rec:rec&&rec.done, pct:rec&&rec.done?benchScore(m.check):null, attempts:null}; }
  const Q=st.progress[m.quiz.id], H=(st.hist||{})[m.quiz.id];
  return {read, done:!!(Q&&Q.done&&Q.pct>=m.quiz.pass), rec:!!(Q&&Q.done),
          pct:Q&&Q.done?Q.pct:null, best:H?H.best:null, attempts:H?H.attempts:0, passedAt:H?H.passedAt:null};
}
function nextUp(t){
  if(!t.built) return null;
  for(let i=0;i<t.modules.length;i++){
    if(!moduleUnlocked(t,i)) return null;
    const m=t.modules[i];
    if(!isDone(m.lesson.id)) return {m,what:'Lesson'};
    if(t.bench){ if(!benchOK(m.check)) return {m,what:m.check.title}; continue; }
    if(!quizPassed(m.quiz))  return {m,what:t.gated?'Self-audit':'Quiz'};
  }
  return null;
}
function allSlots(){
  const out=[];
  TRACKS.forEach(t=>{
    if(!t.built){ out.push({id:t.id+'-ALL',desc:t.name+' — whole track not built yet',filled:false,track:t.id}); return; }
    t.modules.forEach(m=>{
      out.push({id:m.lesson.id,desc:t.gated?`${m.title} — lesson`:`Module ${m.n} — lesson text and video link`,filled:m.lesson.filled,track:t.id});
      if(t.bench) out.push({id:m.check.id,desc:`${m.check.title} — benchmark form`,filled:true,track:t.id});
      else out.push({id:m.quiz.id,desc:t.gated?`${m.title} — self-audit (${m.quiz.pool.length} in pool)`:`Module ${m.n} — quiz questions`,filled:m.quiz.filled,track:t.id});
    });
    t.audits.forEach(a=>out.push({id:a.id,desc:'Audit brief and rubric — ready',filled:true,track:t.id}));
  });
  return out;
}
