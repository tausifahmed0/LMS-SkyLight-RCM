      <div class="top"><h3>${esc(t.name)}</h3><span class="pct">${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="meta">${t.modules.length} ${t.bench?'phases':(t.gated?'body systems':(t.id==='OPS'?'services':'modules'))}${t.audits.length?' · '+t.audits.length+' audits':''}<span class="go">Open →</span></div>
    </button>`;
  });

  const soon=TRACKS.filter(t=>!t.built);
  if(soon.length){
    h+='<div class="grouphead" style="margin-top:30px">Not built yet</div><div class="soonbox">';
    soon.forEach(t=>h+=`<div class="soonrow"><span class="nm">${esc(t.name)}</span><span class="st">${t.planned} modules planned</span></div>`);
    h+='</div>';
  }
  return h;
}

/* ---------- track ---------- */
function viewTrack(t){
  if(!t.built){
    return `<button class="backlink" data-go="dash">← Dashboard</button>
      <div class="slot" style="padding:54px 24px"><span class="id">${t.id}-ALL</span>
      <p><b>${esc(t.name)}</b> is not built yet.</p>
      <p class="hint">${t.planned} modules planned. Send the module titles and lesson text to build this track.</p></div>`;
  }
  let h=`<button class="backlink" data-go="dash">← Dashboard</button>
    <p class="lede">${esc(t.tagline)}.</p>`;

  if(t.bench){
    h+=`<div class="gatebar"><b>Gated progression.</b> Each phase ends with a measured checkpoint —
      typing speed, accuracy and practical tests. The Skills Coach records the numbers and the
      system checks them against the standard. The next phase unlocks only when every line passes.</div>`;
  } else if(t.gated){
    h+=`<div class="gatebar"><b>Self-audit after every body system.</b> ${DRAW} questions drawn from a pool of 30+.
      You need <b>${needed(t.modules[0].quiz)} of ${DRAW}</b> correct to pass — ${PASS_MARK}% or higher.
      All twelve systems are open; work them in any order. Retakes draw new questions.</div>`;
  }

  h+=`<div class="sect"><div class="secthead"><h2>${t.gated?'Body systems':'Modules'}</h2>
      <span class="note">${trackPct(t)}% complete</span></div><div class="panel">`;

  t.modules.forEach((m,i)=>{
    const open=moduleUnlocked(t,i);
    const ld=isDone(m.lesson.id);
    let status;
    if(t.bench){
      const rec=S.bench[m.check.id], ok=benchOK(m.check);
      if(!open)        status='<span class="chip lock">🔒 Locked</span>';
      else if(ok)      status='<span class="chip done">Passed</span>';
      else if(rec&&rec.done) status=`<span class="chip fail">${benchScore(m.check)}% — below</span>`;
      else if(ld)      status='<span class="chip prog">'+esc(m.check.title)+' due</span>';
      else             status='<span class="rowmeta" style="margin:0">Not started</span>';
    } else {
      const qp=quizPassed(m.quiz), qr=S.progress[m.quiz.id];
      if(!open)              status='<span class="chip lock">🔒 Locked</span>';
      else if(moduleDone(m)) status='<span class="chip done">Passed</span>';
      else if(qr)            status=`<span class="chip ${qp?'done':'fail'}">${qr.pct}%</span>`;
      else if(ld)            status='<span class="chip prog">Audit due</span>';
      else                   status='<span class="rowmeta" style="margin:0">Not started</span>';
    }

    const tag=open?'button':'div';
    h+=`<${tag} class="row ${open?'':'locked'}" ${open?`data-go="lesson" data-track="${t.id}" data-item="${m.id}"`:''}>
      <span class="rowno">${String(m.n).padStart(2,'0')}</span>
      <span class="rowbody"><span class="rowtitle">${esc(m.title)}</span>
      <span class="rowmeta">${open?esc(m.goal):'Pass the previous self-audit to unlock'}</span></span>
      <span class="rowright">${status}${open?'<span class="chev">→</span>':''}</span></${tag}>`;

    const a=t.audits.find(x=>x.after===m.n);
    if(a){
      const rec=S.audits[a.id];
      h+=`<div class="gate"><span class="pin"></span>
        <button class="rowbody" data-go="audit" data-track="${t.id}" data-item="${a.id}" style="display:flex;align-items:center;gap:14px">
        <span class="rowbody"><span class="rowtitle">${esc(a.title)}</span>
        <span class="rowmeta">${a.criteria.length} criteria · max ${a.criteria.length*3} points</span></span>
        <span class="rowright"><span class="chip ${rec?'done':'prog'}">${rec?rec.total+'/'+rec.max:'Not scored'}</span><span class="chev">→</span></span>
        </button></div>`;
    }
  });
  return h+'</div></div>';
}

/* ---------- lesson ---------- */
function viewLesson(t,m){
  const ld=isDone(m.lesson.id);
  let h=`<button class="backlink" data-go="track" data-track="${t.id}">← ${esc(t.name)}</button>`;

  h+=`<div class="sect"><div class="secthead"><h2>Lesson</h2><span class="note">${m.lesson.id}</span></div>`;
  if(!m.lesson.noVideo){
    h+=`<div class="videoslot">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B4C3C0" stroke-width="1.5">
      <rect x="2" y="4" width="20" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
      <span class="mono" style="font-size:11px;color:var(--faint)">VIDEO SLOT · ${m.lesson.id}-VIDEO</span>
      <span style="font-size:12.5px;color:var(--faint)">Send a YouTube link to fill this</span></div>`;
  }
  h+= (m.lesson.filled&&m.lesson.body)
    ? `<div class="prose">${m.lesson.body}</div>`
    : `<div class="slot"><span class="id">${m.lesson.id}</span><p>Lesson text goes here.</p>
       <p class="hint">Send the text for <b>${m.lesson.id}</b> and it will appear in this space.</p></div>`;
  h+=`<button class="btn ${ld?'ghost':'mint'}" data-act="togglelesson" data-item="${m.lesson.id}">
      ${ld?'✓ Lesson read':'Mark lesson as read'}</button></div>`;

  if(t.bench){
    h+=`<div class="sect"><div class="secthead"><h2>${esc(m.check.title)}</h2>
        <span class="note">${m.check.id} · ${esc(m.check.when)}</span></div>`;
    h+= ld ? renderCheck(m.check)
           : `<div class="panel"><div class="await">Read the phase brief first, then mark it as read to open the checkpoint.</div></div>`;
    const rec=S.bench[m.check.id];
    if(rec&&rec.done) h+=progressPanel(t,m);
    return h+'</div>';
  }
  const gated=!!t.gated;
  h+=`<div class="sect"><div class="secthead"><h2>${gated?'Self-audit':'Quiz'}</h2>
      <span class="note">${m.quiz.id} · pass ${m.quiz.pass}%</span></div>`;

  if(gated&&t.lockstep&&!ld){
    h+=`<div class="panel"><div class="await">Read the lesson first, then mark it as read to open the self-audit.</div></div></div>`;
    return h;
  }
  h+= (!m.quiz.filled||(m.quiz.qs&&!m.quiz.qs.length))
    ? `<div class="slot"><span class="id">${m.quiz.id}</span><p>Quiz questions go here.</p>
       <p class="hint">Send each question with four options and the correct answer.</p></div>`
    : renderQuiz(m.quiz,S.progress[m.quiz.id],gated,t,m);
  const done=S.progress[m.quiz.id];
  if(done&&done.done) h+=progressPanel(t,m);
  return h+'</div>';
}

function renderQuiz(quiz,rec,gated,t,m){
  const qs=quizQs(quiz), shown=rec&&rec.answers;
  let h='';
  if(gated&&!shown){
    h+=`<div class="gatebar soft">${qs.length} questions drawn from a pool of ${quiz.pool.length}.
        You need <b>${needed(quiz)} correct</b> to unlock the next body system.</div>`;
  }
  h+='<div class="panel">';
  qs.forEach((q,i)=>{
    h+=`<div class="q"><div class="qn">Question ${i+1} of ${qs.length}</div><div class="qt">${esc(q.q)}</div>`;
    q.opts.forEach((o,j)=>{
      let cls='';
      if(shown){ if(j===q.a) cls='right'; else if(rec.answers[i]===j) cls='wrong'; }
      else if(draft[quiz.id]&&draft[quiz.id][i]===j) cls='pick';
      h+=`<button class="opt ${cls}" data-act="pick" data-quiz="${quiz.id}" data-q="${i}" data-o="${j}" ${shown?'disabled':''}>
          <span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`;
    });
    h+='</div>';
  });
  h+='<div class="quizfoot">';
  if(shown){
    const pass=rec.pct>=quiz.pass;
    h+=`<div class="scorebox ${pass?'':'low'}"><b>${rec.pct}%</b><span>${rec.correct} of ${rec.total} correct</span></div>
        <span class="chip ${pass?'done':'fail'}">${pass?'Passed':`Needs ${needed(quiz)} of ${rec.total}`}</span>
        ${(S.hist[quiz.id]?`<span class="mono attempts">attempt ${S.hist[quiz.id].attempts} · best ${S.hist[quiz.id].best}%</span>`:'')}
        <button class="btn ghost" data-act="retake" data-quiz="${quiz.id}" style="margin-left:auto">
        ${quiz.pool?'Retake with new questions':'Retake — questions reshuffled'}</button>`;
    if(gated&&pass) h+=`<div style="width:100%;margin-top:6px" class="unlocked">✓ Next body system unlocked.</div>`;
  }else{
    const n=draft[quiz.id]?Object.keys(draft[quiz.id]).length:0;
    h+=`<button class="btn mint" data-act="submit" data-quiz="${quiz.id}" ${n<qs.length?'disabled':''}>Submit answers</button>
        <span class="mono qcount" data-total="${qs.length}" style="font-size:11.5px;color:var(--faint)">${n} of ${qs.length} answered</span>`;
  }
  return h+'</div></div>';
}


/* ---------- benchmark checkpoint form ---------- */
function renderCheck(chk){
  const trainer = isTrainer();
  const rec = S.bench[chk.id];
  const d = S.bdraft[chk.id] || (S.bdraft[chk.id] = {v:{}, c:{}});
  const val = id => rec&&rec.done ? rec.v[id] : d.v[id];
  const chkd = id => rec&&rec.done ? !!(rec.c&&rec.c[id]) : !!d.c[id];

  let h = `<div class="gatebar soft">${esc(chk.note)}</div><div class="panel">`;

  if(chk.type==='scorecard'){
    h+='<table class="bench"><thead><tr><th>Component</th><th>Test</th><th>Weight</th><th>Score /100</th><th></th></tr></thead><tbody>';
    chk.components.forEach(c=>{
      const v=val(c.id), has=v!==undefined&&v!=='';
      const ok=has&&Number(v)>=chk.floor;
      h+=`<tr><td class="bl">${esc(c.label)}</td><td class="bt">${esc(c.test)}</td>
        <td class="bw">${c.weight}%</td>
        <td><input class="bin" type="number" min="0" max="100" step="1" value="${has?esc(v):''}"
            data-act="bval" data-chk="${chk.id}" data-f="${c.id}" ${trainer&&!(rec&&rec.done)?'':'disabled'}></td>
        <td class="bs">${has?`<span class="chip ${ok?'done':'fail'}">${ok?'≥60':'below 60'}</span>`:''}</td></tr>`;
    });
    h+='</tbody></table>';
  } else {
    h+='<table class="bench"><thead><tr><th>Measure</th><th>Standard</th><th>Recorded</th><th></th></tr></thead><tbody>';
    chk.metrics.forEach(m=>{
      const v=val(m.id), has=v!==undefined&&v!=='';
      const ok=has&&(m.dir==='max'?Number(v)<=m.target:Number(v)>=m.target);
      h+=`<tr><td class="bl">${esc(m.label)}</td>
        <td class="bt">${m.dir==='max'?'≤':'≥'} ${m.target} ${esc(m.unit)}</td>
        <td><input class="bin" type="number" step="0.1" value="${has?esc(v):''}"
            data-act="bval" data-chk="${chk.id}" data-f="${m.id}" ${trainer&&!(rec&&rec.done)?'':'disabled'}></td>
        <td class="bs">${has?`<span class="chip ${ok?'done':'fail'}">${ok?'Pass':'Below'}</span>`:''}</td></tr>`;
    });
    (chk.checks||[]).forEach(c=>{
      h+=`<tr><td class="bl" colspan="2">${esc(c.label)}</td>
        <td colspan="2"><button class="tick ${chkd(c.id)?'on':''}" data-act="btick" data-chk="${chk.id}"
          data-f="${c.id}" ${trainer&&!(rec&&rec.done)?'':'disabled'}>${chkd(c.id)?'✓ Passed':'Mark passed'}</button></td></tr>`;
    });
    h+='</tbody></table>';
  }

  h+='<div class="quizfoot">';
  if(rec&&rec.done){
    const ok=benchOK(chk), sc=benchScore(chk);
    h+=`<div class="scorebox ${ok?'':'low'}"><b>${sc}%</b><span>recorded ${esc(rec.at)}</span></div>
        <span class="chip ${ok?'done':'fail'}">${ok?'Standard met':'Below standard'}</span>`;
    if(ok) h+=`<div style="width:100%;margin-top:6px" class="unlocked">✓ Next phase unlocked.</div>`;
    else   h+=`<div style="width:100%;margin-top:6px" class="belowmsg">Not an exit point. Coach sets a targeted plan on the failing component and re-tests at the next checkpoint.</div>`;
    if(trainer) h+=`<button class="btn ghost" data-act="bclear" data-chk="${chk.id}" style="margin-left:auto">Record again</button>`;
  } else if(!trainer){
    h+=`<span class="mono" style="font-size:12px;color:var(--faint)">Your Skills Coach records this result. Switch to Trainer to enter it.</span>`;
  } else {
    const fields = chk.type==='scorecard' ? chk.components : chk.metrics;
    const n = fields.filter(f=>{const v=d.v[f.id]; return v!==undefined&&v!=='';}).length;
    const cn = (chk.checks||[]).filter(c=>d.c[c.id]).length;
    const total = fields.length, ctotal=(chk.checks||[]).length;
    h+=`<button class="btn mint" data-act="bsave" data-chk="${chk.id}" ${n<total?'disabled':''}>Record result</button>
        <span class="mono" style="font-size:11.5px;color:var(--faint)">${n} of ${total} measures entered${ctotal?` · ${cn} of ${ctotal} practicals ticked`:''}</span>`;
  }
  return h+'</div></div>';
}

/* ---------- trainer audit rubric ---------- */
function viewAudit(t,a){
  const rec=S.audits[a.id], trainer=isTrainer();
  let h=`<button class="backlink" data-go="track" data-track="${t.id}">← ${esc(t.name)}</button>
    <p class="lede">${esc(a.brief)}</p>
    <div class="sect"><div class="secthead"><h2>Audit rubric</h2><span class="note">${a.id}</span></div>`;
  if(!trainer&&!rec){
    return h+`<div class="panel"><div class="await">Awaiting trainer review.<br>
      <span class="mono" style="font-size:12px;color:var(--faint)">Switch to Trainer in the sidebar to score this audit.</span></div></div></div>`;
  }
  h+='<div class="panel"><div class="rubricwrap"><table class="rubric"><thead><tr><th>Criterion</th>';
  LEVELS.forEach(l=>h+=`<th>${l.p} · ${esc(l.label)}</th>`);
  h+='</tr></thead><tbody>';
  a.criteria.forEach(c=>{
    const cur=rec?rec.scores[c.id]:(draftAudit[a.id]?draftAudit[a.id][c.id]:undefined);
    h+=`<tr><td class="crit">${esc(c.name)}<small>${esc(c.note)}</small></td>`;
    LEVELS.forEach(l=>h+=`<td><button class="lvl ${cur===l.p?'on':''}" data-act="rate" data-audit="${a.id}"
        data-crit="${c.id}" data-p="${l.p}" ${trainer?'':'disabled'}><b>${l.p} pts</b>${esc(l.desc)}</button></td>`);
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="rubricfoot">';
  const max=a.criteria.length*3;
  if(rec){
    const pct=Math.round(rec.total/rec.max*100);
    h+=`<div class="scorebox ${pct>=70?'':'low'}"><b>${rec.total}/${rec.max}</b><span>${pct}% · scored ${esc(rec.at)}</span></div>
        <span class="chip ${pct>=70?'done':'fail'}">${pct>=70?'Meets standard':'Coaching required'}</span>`;
    if(trainer) h+=`<button class="btn ghost" data-act="reaudit" data-audit="${a.id}" style="margin-left:auto">Score again</button>`;
  }else{
    const d=draftAudit[a.id]||{}, n=Object.keys(d).length, tot=Object.values(d).reduce((x,y)=>x+y,0);
    h+=`<button class="btn mint" data-act="saveaudit" data-audit="${a.id}" ${n<a.criteria.length?'disabled':''}>Save audit score</button>
        <span class="mono" style="font-size:11.5px;color:var(--faint)">${n} of ${a.criteria.length} scored · running total ${tot}/${max}</span>`;
  }
  return h+'</div></div></div>';
}

/* ---------- checklist ---------- */
function viewChecklist(){
  const slots=allSlots(), filled=slots.filter(s=>s.filled).length;
  let h=`<p class="lede">Every content slot in the system. Send text with the slot ID and it goes straight into the right place.</p>
   <div class="summary">
     <div class="stat"><b style="color:var(--mint-ink)">${filled}</b><span>Filled</span></div>
     <div class="stat"><b>${slots.length-filled}</b><span>Empty</span></div>
     <div class="stat"><b>${Math.round(filled/slots.length*100)}%</b><span>Built</span></div></div>`;
  TRACKS.forEach(t=>{
    const rows=slots.filter(s=>s.track===t.id);

        <span class="note">${rows.filter(r=>r.filled).length}/${rows.length} filled</span></div><div class="panel">`;
    rows.forEach(r=>h+=`<div class="clrow"><span class="clid">${esc(r.id)}</span>
        <span class="cldesc">${esc(r.desc)}</span>
        <span class="chip ${r.filled?'done':'prog'}">${r.filled?'Filled':'Empty'}</span></div>`);

/* ---------- progress ---------- */
function ring(pct,size){
  const r=(size||46)/2-4, c=2*Math.PI*r, o=c*(1-pct/100);
  return `<svg class="ring" width="${size||46}" height="${size||46}" viewBox="0 0 ${size||46} ${size||46}">
    <circle cx="${(size||46)/2}" cy="${(size||46)/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="4"/>
    <circle cx="${(size||46)/2}" cy="${(size||46)/2}" r="${r}" fill="none" stroke="var(--mint)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}"
      transform="rotate(-90 ${(size||46)/2} ${(size||46)/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy="0.34em" class="ringt">${pct}%</text></svg>`;
}
function trackCounts(t,st){
  st=st||S; let done=0,started=0;
  t.modules.forEach(m=>{ const x=moduleState(t,m,st); if(x.done)done++; else if(x.read||x.rec)started++; });
  return {done,started,left:t.modules.length-done-started,total:t.modules.length};
}

/* the panel a trainee sees straight after an audit */
function progressPanel(t,m){
  const x=moduleState(t,m), c=trackCounts(t), pct=trackPct(t);
  const unit = t.bench?'phase':(t.gated?'body system':'module');
  return `<div class="ppanel">
    <div class="pleft">${ring(pct,64)}</div>
    <div class="pmid">
      <b>${esc(t.name)}</b>
      <span>${unit.charAt(0).toUpperCase()+unit.slice(1)} ${m.n} of ${t.modules.length} · ${c.done} passed, ${c.started} in progress, ${c.left} not started</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="pright">
      ${x.pct!==null?`<span class="pstat"><b>${x.pct}%</b><i>this attempt</i></span>`:''}
      ${x.best!=null?`<span class="pstat"><b>${x.best}%</b><i>best</i></span>`:''}
      ${x.attempts?`<span class="pstat"><b>${x.attempts}</b><i>attempt${x.attempts>1?'s':''}</i></span>`:''}
    </div></div>`;
}

function viewProgress(){
  const built=TRACKS.filter(t=>t.built);
  const overall=Math.round(built.reduce((a,t)=>a+trackPct(t),0)/built.length);
  const u=me();
  let h=`<p class="lede">Everything you have completed so far. Scores update the moment you finish an audit.</p>
    <div class="phero">${ring(overall,86)}
      <div><b>${esc(u?u.name:'')}</b>
      <span>${overall}% of all four tracks complete${u&&u.batch?' · '+esc(u.batch):''}</span></div></div>`;
  built.forEach(t=>{
    const c=trackCounts(t), pct=trackPct(t);
    h+=`<div class="sect"><div class="secthead"><h2>${esc(t.name)}</h2>
      <span class="note">${c.done} of ${c.total} passed · ${pct}%</span></div>
      <div class="bar" style="margin-bottom:12px"><i style="width:${pct}%"></i></div>
      <div class="panel">`;
    t.modules.forEach((m,i)=>{
      const x=moduleState(t,m), open=moduleUnlocked(t,i);
      let chip = !open?'<span class="chip lock">🔒 Locked</span>'
             : x.done?'<span class="chip done">Passed</span>'
             : x.rec?`<span class="chip fail">${x.pct}%</span>`
             : x.read?'<span class="chip prog">In progress</span>'
             : '<span class="chip todo">Not started</span>';
      const bits=[];
      if(x.best!=null) bits.push('best '+x.best+'%');
      if(x.attempts) bits.push(x.attempts+' attempt'+(x.attempts>1?'s':''));
      if(x.passedAt) bits.push('passed '+x.passedAt);
      const meta = !open ? 'Pass the previous checkpoint to unlock'
                 : (bits.length?esc(bits.join(' · ')):'No attempts yet');
      const tag = open?'button':'div';
      h+=`<${tag} class="row ${open?'':'locked'}" ${open?`data-go="lesson" data-track="${t.id}" data-item="${m.id}"`:''}>
        <span class="rowno">${String(m.n).padStart(2,'0')}</span>
        <span class="rowbody"><span class="rowtitle">${esc(m.title)}</span>
        <span class="rowmeta">${meta}</span></span>
        <span class="rowright">${chip}${open?'<span class="chev">→</span>':''}</span></${tag}>`;
    });
    h+='</div></div>';
  });
  return h;
}

function viewTrainees(){
  if(!traineeCache) return '<div class="panel"><div class="await">Loading batch progress…</div></div>';
  if(!traineeCache.length) return `<p class="lede">No trainee accounts yet.</p>
    <div class="slot"><p>When trainees create accounts on this device they appear here with live progress.</p></div>`;
  let h=`<p class="lede">Every trainee account and how far they have got. Tap a row to see their track breakdown.</p><div class="panel">`;
  traineeCache.forEach(r=>{
    h+=`<div class="trow">
      <span class="uav sm">${esc(initials(r.u.name))}</span>
      <span class="rowbody"><span class="rowtitle">${esc(r.u.name)}</span>
      <span class="rowmeta">${esc(r.u.batch||'No batch')} · ${esc(r.u.email)}</span></span>
      <span class="tbars">${r.per.map(p=>`<span class="tb" title="${esc(p.short)}">
        <i style="height:${Math.max(4,p.pct)}%"></i><em>${p.id}</em></span>`).join('')}</span>
      <span class="rowright">${ring(r.overall,44)}</span></div>`;
  });
  return h+'</div>';
}

/* ---------- render ---------- */
function render(){
  const bar=document.getElementById('topbar'), v=document.getElementById('view');
  let crumb='',title='',body='';
  if(route.view==='dash'){ crumb='Overview'; title='Dashboard'; body=viewDash(); }
  else if(route.view==='checklist'){ crumb='Build'; title='Content checklist'; body=viewChecklist(); }
  else if(route.view==='progress'){ crumb='You'; title='My progress'; body=viewProgress(); }
  else if(route.view==='trainees'){ crumb='Coaching'; title='Trainees'; body=viewTrainees(); }
  else{
    const t=track(route.track);
    if(route.view==='lesson'){
      const mi=t.modules.findIndex(x=>x.id===route.item);
      if(mi>-1 && !moduleUnlocked(t,mi)){ route={view:'track',track:t.id,item:null}; S.route=route; }
    }
    if(route.view==='track'){ crumb=`<b>${esc(t.id)}</b>`; title=t.name; body=viewTrack(t); }
    if(route.view==='lesson'){ const m=t.modules.find(x=>x.id===route.item);
      crumb=`<b>${esc(t.id)}</b> · ${t.gated?'System':'Module'} ${m.n} of ${t.modules.length}`;
      title=m.title; body=viewLesson(t,m); }
    if(route.view==='audit'){ const a=t.audits.find(x=>x.id===route.item);
      crumb=`<b>${esc(t.id)}</b> · Checkpoint`; title=a.title; body=viewAudit(t,a); }
  }
  bar.innerHTML=`<div class="tinner"><div class="crumb">${crumb}</div><h1>${esc(title)}</h1></div>`;
  const key=[route.view,route.track,route.item].join('|');
  const y=window.scrollY;
  v.innerHTML=body; renderNav();
  if(key!==lastKey){
    lastKey=key; window.scrollTo(0,0);
    v.classList.remove('anim'); void v.offsetWidth; v.classList.add('anim');
  } else { window.scrollTo(0,y); }
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');
  if(go){
    route={view:go.dataset.go,track:go.dataset.track||null,item:go.dataset.item||null};
    S.route=route; touch(); render();
    if(route.view==='trainees'){ await loadTrainees(); if(route.view==='trainees') render(); }
    return;
  }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;

  if(act==='signout'){ await signOut(); return; }
  if(act==='preview'){ S.preview=!S.preview; await save(true);
    if(!isTrainer()&&route.view==='trainees'){ route={view:'dash',track:null,item:null}; S.route=route; }
    render(); return; }
  if(act==='selpre'){
    const r=document.createRange(); r.selectNodeContents(a);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const lbl=a.previousElementSibling&&a.previousElementSibling.querySelector('.dhint');
    if(lbl){ lbl.textContent='selected — press Ctrl+C'; lbl.classList.add('hit');
      setTimeout(()=>{lbl.textContent='click to select'; lbl.classList.remove('hit');},2600); }
    return;
  }
  if(act==='togglelesson'){
    const id=a.dataset.item;
    S.progress[id]=isDone(id)?{done:false}:{done:true,at:new Date().toISOString()};
    await save(); render();
  }
  if(act==='pick'){
    const q=a.dataset.quiz, qi=+a.dataset.q, oi=+a.dataset.o;
    draft[q]=draft[q]||{}; draft[q][qi]=oi;
    document.querySelectorAll('[data-act="pick"][data-quiz="'+q+'"][data-q="'+qi+'"]')
      .forEach(b=>b.classList.toggle('pick', +b.dataset.o===oi));
    const c=document.querySelector('.qcount');
    if(c){
      const n=Object.keys(draft[q]).length, tot=+c.dataset.total;
      c.textContent=n+' of '+tot+' answered';
      const btn=document.querySelector('[data-act="submit"][data-quiz="'+q+'"]');
      if(btn) btn.disabled = n<tot;
    }
    touch(); return;
  }
  if(act==='submit'){
    const qid=a.dataset.quiz, quiz=findQuiz(qid), qs=quizQs(quiz), ans=draft[qid]||{};
    let correct=0; qs.forEach((q,i)=>{ if(ans[i]===q.a) correct++; });
    const pct=Math.round(correct/qs.length*100);
    const H=S.hist[qid]||{attempts:0,best:0,passedAt:null};
    H.attempts++; H.best=Math.max(H.best,pct);
    if(pct>=quiz.pass && !H.passedAt) H.passedAt=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    S.hist[qid]=H;
    S.progress[qid]={done:true,correct,total:qs.length,pct,answers:ans,at:new Date().toISOString()};
    delete S.draft[qid];
    await save(); render();
  }
  if(act==='retake'){
    const q=a.dataset.quiz;
    delete S.progress[q]; delete S.sets[q]; delete S.draft[q];
    await save(); render();
  }
  if(act==='btick'){
    const id=a.dataset.chk; S.bdraft[id]=S.bdraft[id]||{v:{},c:{}};
    S.bdraft[id].c[a.dataset.f]=!S.bdraft[id].c[a.dataset.f]; render();
  }
  if(act==='bsave'){
    const id=a.dataset.chk, d=S.bdraft[id]||{v:{},c:{}};
    S.bench[id]={done:true,v:d.v,c:d.c,
      at:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
    await save(); render();
  }
  if(act==='bclear'){
    const id=a.dataset.chk;
    S.bdraft[id]={v:Object.assign({},S.bench[id].v),c:Object.assign({},S.bench[id].c)};
    delete S.bench[id]; await save(); render();
  }
  if(act==='rate'){
    const id=a.dataset.audit, crit=a.dataset.crit;
    draftAudit[id]=draftAudit[id]||{}; draftAudit[id][crit]=+a.dataset.p;
    document.querySelectorAll('[data-act="rate"][data-audit="'+id+'"][data-crit="'+crit+'"]')
      .forEach(b=>b.classList.toggle('on', b===a));
    render(); return;
  }
  if(act==='saveaudit'){
    const id=a.dataset.audit, sc=draftAudit[id]||{}, aud=findAudit(id);
    S.audits[id]={scores:sc,total:Object.values(sc).reduce((x,y)=>x+y,0),max:aud.criteria.length*3,
      at:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
    await save(); render();
  }
  if(act==='reaudit'){ const id=a.dataset.audit; draftAudit[id]=Object.assign({},S.audits[id].scores);
    delete S.audits[id]; await save(); render(); }
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act="bval"]'); if(!el) return;
  const id=el.dataset.chk; S.bdraft[id]=S.bdraft[id]||{v:{},c:{}};
  S.bdraft[id].v[el.dataset.f]= el.value===''?undefined:Number(el.value);
  const row=el.closest('tr'), cell=row&&row.querySelector('.bs');
  if(cell){
    const chk=findCheck(id);
    const f=(chk.type==='scorecard'?chk.components:chk.metrics).find(x=>x.id===el.dataset.f);
    if(el.value===''){ cell.innerHTML=''; }
    else if(chk.type==='scorecard'){
      const ok=Number(el.value)>=chk.floor;
      cell.innerHTML=`<span class="chip ${ok?'done':'fail'}">${ok?'≥60':'below 60'}</span>`;
    } else {
      const ok=f.dir==='max'?Number(el.value)<=f.target:Number(el.value)>=f.target;
      cell.innerHTML=`<span class="chip ${ok?'done':'fail'}">${ok?'Pass':'Below'}</span>`;
    }
  }
  touch();
  const btn=document.querySelector('[data-act="bsave"][data-chk="'+id+'"]');
  if(btn){
    const chk=findCheck(id), fields=chk.type==='scorecard'?chk.components:chk.metrics;
    const d=S.bdraft[id].v;
    btn.disabled = !fields.every(f=>d[f.id]!==undefined);
  }
});

const findQuiz=id=>{ for(const t of TRACKS) for(const m of t.modules) if(m.quiz&&m.quiz.id===id) return m.quiz; };
const findCheck=id=>{ for(const t of TRACKS) for(const m of t.modules) if(m.check&&m.check.id===id) return m.check; };
const findAudit=id=>{ for(const t of TRACKS) for(const a of t.audits) if(a.id===id) return a; };

async function enterApp(){
  const u=me(); if(!u) return;
  clearTimeout(queueTimer); queueTimer=null;   // drop anything queued for the previous account
  KEY=stateKey(u.id);
  S={role:u.role,progress:{},audits:{},sets:{},bench:{},draft:{},bdraft:{},hist:{},route:null,preview:false};
  await load();
  route = validRoute(S.route) || {view:'dash',track:null,item:null};
  lastKey='';
  document.getElementById('boot').hidden=true;
  document.getElementById('auth').hidden=true;
  document.getElementById('app').hidden=false;
  render();
  save(true,KEY);
  if(route.view==='trainees'){ await loadTrainees(); render(); }
}
function showAuth(){
  document.getElementById('boot').hidden=true;
  document.getElementById('app').hidden=true;
  document.getElementById('auth').hidden=false;
  renderAuth();
}
function validRoute(r){
  if(!r||!r.view) return null;
  if(['dash','checklist','progress','trainees'].includes(r.view)) return {view:r.view,track:null,item:null};
  const t=track(r.track); if(!t) return null;
  if(r.view==='track') return {view:'track',track:t.id,item:null};
  if(r.view==='lesson'){
    const i=t.modules.findIndex(m=>m.id===r.item);
    return (i>-1 && moduleUnlocked(t,i))?{view:'lesson',track:t.id,item:r.item}:{view:'track',track:t.id,item:null};
  }
  if(r.view==='audit')  return t.audits.some(a=>a.id===r.item)?{view:'audit',track:t.id,item:r.item}:{view:'track',track:t.id,item:null};
  return null;
}
/* auth screen wiring */
document.getElementById('authtabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  authTab=b.dataset.auth; authMsg=''; renderAuth();
});
document.getElementById('auth').addEventListener('click',async e=>{
  const rp=e.target.closest('#rolepick button');
  if(rp){ pickedRole=rp.dataset.role;
    document.querySelectorAll('#rolepick button').forEach(x=>x.classList.toggle('on',x===rp)); return; }
  const q=e.target.closest('[data-act="quick"]');
  if(q){ await quickLogin(q.dataset.id); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='dologin')  await doLogin();
  if(b.dataset.act==='dosignup') await doSignup();
});
document.getElementById('auth').addEventListener('input',e=>{
  const i=e.target.closest('input'); if(!i) return;
  i.closest('.fld').classList.toggle('filled', !!i.value);
  const msg=document.querySelector('.authmsg');
  if(msg){ msg.classList.add('gone'); setTimeout(()=>{ if(authMsg){ authMsg=''; } },200); }
  syncReady();
});
document.getElementById('auth').addEventListener('keydown',async e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  if(authTab==='signin') await doLogin(); else await doSignup();
});

const hasSession = () => !!(A.session && A.users.some(u=>u.id===A.session));

(async()=>{
  const ready=await waitStorage();
  if(!ready){ showAuth(); return; }

  // Short budget behind the splash so a genuine first run reaches the form fast.
  let ok=await loadAccounts();
  if(!ok && !hasSession()){ await napms(200); ok=await loadAccounts(); }
  if(hasSession()){ await enterApp(); return; }

  showAuth();

  // If those reads were failing rather than genuinely empty, keep trying quietly.
  // A recovered session signs the person back in without them touching anything.
  if(!ok){
    for(let i=0;i<6;i++){
      await napms(400+i*250);
      if(A.session || !document.getElementById('auth') || document.getElementById('auth').hidden) return;
      if(await loadAccounts()){
        if(hasSession()) await enterApp();
        return;
      }
    }
  }
})();
</script>
